[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = .venv backup backups data dist .git .agents .codex
addopts = -p no:cacheprovider
markers =
    e2e: bounded synthetic packet-to-report replay on disposable PostgreSQL
    core: critical current-runtime regression tests
    legacy: closed migration or compatibility tests retained for major-stage regression
    windows: tests requiring or validating Windows PowerShell/runtime behavior
    windows_only: tests requiring native Windows APIs, Windows PowerShell or Windows filesystem semantics; skipped elsewhere
    postgres_integration: tests requiring an isolated PostgreSQL test database
    postgres_owned_cluster: test owns its entire private PostgreSQL cluster, bypassing shared templates
    postgres_empty: PostgreSQL integration test that installs its own schema from an empty template
    postgres_historical(version, name): test clones a disposable PostgreSQL template through the named last migration
    html_audit: HTML inventory, generation, HTTP and browser audit tests
    host_dependent: needs operator-host software or capacity (RSAT AD modules, idle CPU); excluded from the PR gate
