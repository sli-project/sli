components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: adlog_session
    bearerApiKey:
      type: http
      scheme: bearer
    headerApiKey:
      type: apiKey
      in: header
      name: X-ADLog-API-Key
    agentMutualTls:
      type: mutualTLS
      description: Client certificate issued by the SLI agent CA.
  responses:
    Unauthorized:
      description: authentication_required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: insufficient_permissions or capability_required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    DomainResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DomainItem'
    DomainItem:
      type: object
      additionalProperties: false
      required: [id, display_name, is_archived, freshness]
      properties:
        id: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
        display_name: {type: string, description: 'Registered FQDN, not an invented display label.'}
        is_archived: {type: boolean}
        freshness:
          $ref: '#/components/schemas/DomainFreshness'
    DomainFreshness:
      type: object
      additionalProperties: false
      required: [snapshot_at_utc, published_at_utc, snapshot_state, observed_at_utc, default_observed_at_utc, event_at_utc, last_successful_collection_utc]
      properties:
        snapshot_at_utc: {type: [string, 'null'], format: date-time}
        published_at_utc: {type: [string, 'null'], format: date-time}
        snapshot_state: {type: [string, 'null'], description: Stored coverage state; not synthesized from timestamps.}
        observed_at_utc: {type: [string, 'null'], format: date-time}
        default_observed_at_utc: {type: [string, 'null'], format: date-time}
        event_at_utc: {type: [string, 'null']}
        last_successful_collection_utc: {type: [string, 'null']}
      description: >-
        Snapshot/context timestamps use datetime.isoformat semantics (+00:00 and optional six-digit microseconds).
        Event/collection cursor timestamps are preserved text, without a new date-time constraint.
    DomainAuthenticationError:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error: {const: authentication_required}
        message:
          type: object
          additionalProperties: false
          required: [code, params, text]
          properties:
            code: {const: login.error.authenticationRequired}
            params: {type: object, additionalProperties: false}
            text: {type: string}
    DomainTransportError:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error: {const: secure_transport_required}
        message:
          type: object
          additionalProperties: false
          required: [code, params, text]
          properties:
            code: {const: login.error.https}
            params: {type: object, additionalProperties: false}
            text: {type: string}
    DomainCapabilityError:
      type: object
      additionalProperties: false
      required: [error, required_capability]
      properties:
        error:
          type: string
          enum: [invalid_scope_policy, explicit_deny, resource_context_required, insufficient_capability]
        required_capability: {const: workspace.view}
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          description: Stable machine code.
    EnrollRequest:
      type: object
      required:
      - token
      - csr_pem
      additionalProperties: false
      properties:
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        csr_pem:
          type: string
          maxLength: 16384
        instance_name:
          type: string
    CertificateResponse:
      type: object
      required:
      - agent_id
      - serial
      - certificate_pem
      - ca_chain_pem
      - expires_at
      properties:
        agent_id:
          type: string
          format: uuid
        serial:
          type: string
          description: Hexadecimal certificate serial.
        certificate_pem:
          type: string
        ca_chain_pem:
          type: string
          description: Intermediate and root CA certificates.
        expires_at:
          type: string
          format: date-time
    GroupEnrollRequest:
      type: object
      required:
      - token
      - computer_entity_id
      - host_id
      - csr_pem
      additionalProperties: false
      properties:
        token:
          type: string
        computer_entity_id:
          type: integer
          minimum: 1
        host_id:
          type: string
          format: uuid
        csr_pem:
          type: string
          maxLength: 16384
        instance_name:
          type: string
    GroupEnrollResponse:
      type: object
      required:
      - request_id
      - status
      properties:
        request_id:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
        token:
          type: string
          description: One-time enrollment token; only when approved.
        expires_at:
          type: string
    RenewRequest:
      type: object
      required:
      - csr_pem
      additionalProperties: false
      properties:
        csr_pem:
          type: string
          maxLength: 16384
    CollectionPolicy:
      type: object
      required:
      - state
      - interval_seconds
      - batch_size
      - rate_limit_per_minute
      - spool_max_bytes
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - active
          - paused
          - drain
        interval_seconds:
          type: integer
          minimum: 1
          maximum: 86400
        batch_size:
          type: integer
          minimum: 1
          maximum: 128
        rate_limit_per_minute:
          type: integer
          minimum: 1
          maximum: 10000
        spool_max_bytes:
          type: integer
          minimum: 65536
          maximum: 1073741824
        manage_windows_audit:
          type: boolean
        audit_process_command_line:
          type: boolean
    AssignedModule:
      type: object
      required:
      - module_id
      - enabled
      - config
      properties:
        module_id:
          type: string
        enabled:
          type: boolean
        config:
          type: object
    AgentUpdateOffer:
      type: object
      required:
      - sha256
      - version
      properties:
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    AgentCheckIn:
      type: object
      required:
      - agent_id
      - assigned_modules
      - policy_revision
      - rights_probe_request
      - collection_policy
      - eventlog_diagnostics_supported
      - agent_update
      properties:
        agent_id:
          type: string
        assigned_modules:
          type: array
          maxItems: 64
          items:
            $ref: '#/components/schemas/AssignedModule'
        policy_revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        rights_probe_request:
          type:
          - object
          - 'null'
        collection_policy:
          $ref: '#/components/schemas/CollectionPolicy'
        eventlog_diagnostics_supported:
          type: boolean
        delivery_diagnostics_supported:
          type: boolean
        file_audit:
          type: object
          description: Present only when a file audit request is pending.
        agent_update:
          oneOf:
          - $ref: '#/components/schemas/AgentUpdateOffer'
          - type: 'null'
    RemovalCommand:
      type: object
      required:
      - agent_id
      - agent_removal
      additionalProperties: false
      properties:
        agent_id:
          type: string
        agent_removal:
          type: object
          required:
          - command_id
          - action
          additionalProperties: false
          properties:
            command_id:
              type: string
              format: uuid
            action:
              type: string
              const: uninstall
    CheckInResponse:
      oneOf:
      - $ref: '#/components/schemas/AgentCheckIn'
      - $ref: '#/components/schemas/RemovalCommand'
    PolicyReportRequest:
      type: object
      additionalProperties: false
      properties:
        applied_policy_revision:
          type: integer
          minimum: 0
        collection_state:
          type: string
          enum:
          - active
          - paused
        rights_probe:
          type: object
          required:
          - request_id
          - status
          additionalProperties: false
          properties:
            request_id:
              type: string
            status:
              type: string
              enum:
              - allowed
              - denied
              - unavailable
        eventlog_diagnostics:
          type: array
          items:
            type: object
        delivery_diagnostics:
          type: array
          items:
            type: object
          description: Sent alone, without the other keys.
    PolicyReportResponse:
      type: object
      properties:
        applied_policy_revision:
          type: integer
          minimum: 0
        rights_probe:
          type: object
        applied_collection_state:
          type: string
        delivery_diagnostics:
          type: object
    Cursor:
      type: object
      required:
      - strategy
      - token
      additionalProperties: false
      properties:
        strategy:
          type: string
          enum:
          - record_id
          - bookmark
          - file_offset
          - snapshot
        token:
          type: string
          maxLength: 4096
    AgentEnvelope:
      type: object
      additionalProperties: false
      required:
      - contract_id
      - packet_id
      - agent_id
      - source_instance_id
      - module_id
      - module_version
      - policy_revision
      - channel
      - generation
      - sequence
      - cursor_before
      - cursor_after
      - payload_contract
      - payload_sha256
      - record_count
      - payload_bytes
      - observed_at_utc
      - continuity_state
      - filtered_count
      - lost_count
      properties:
        contract_id:
          type: string
          const: sli.agent-envelope.v1
        packet_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        source_instance_id:
          type: string
          minLength: 1
          maxLength: 512
        module_id:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{0,127}$
        module_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        policy_revision:
          type: string
          minLength: 1
          maxLength: 512
        channel:
          type: string
          minLength: 1
          maxLength: 512
        generation:
          type: string
          minLength: 1
          maxLength: 512
        sequence:
          type: integer
          minimum: 1
        cursor_before:
          $ref: '#/components/schemas/Cursor'
        cursor_after:
          $ref: '#/components/schemas/Cursor'
        payload_contract:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{0,127}$
        payload_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        record_count:
          type: integer
          minimum: 0
        payload_bytes:
          type: integer
          minimum: 0
        observed_at_utc:
          type: string
          format: date-time
        continuity_state:
          type: string
          enum:
          - complete
          - not_proven
          - gap
          - filtered
        filtered_count:
          type: integer
          minimum: 0
        lost_count:
          type:
          - integer
          - 'null'
          minimum: 0
    AgentPacket:
      type: object
      required:
      - envelope
      - payload
      - signature
      additionalProperties: false
      properties:
        envelope:
          $ref: '#/components/schemas/AgentEnvelope'
        payload:
          type: object
          description: Module payload, e.g. sli.collection-packet.v1. Canonical size of the whole packet is at most
            60 KiB.
        signature:
          type: string
          description: Base64 signature over the canonical envelope (see agent-dotnet/PROTOCOL.md section 4.4).
    AgentReceipt:
      type: object
      additionalProperties: false
      required:
      - contract_id
      - packet_id
      - payload_sha256
      - status
      - committed_cursor
      - evidence_ref
      - committed_at_utc
      - error_code
      properties:
        contract_id:
          type: string
          const: sli.agent-receipt.v1
        packet_id:
          type: string
          format: uuid
        payload_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        status:
          type: string
          enum:
          - committed
          - duplicate
          - rejected
          - retry_later
        committed_cursor:
          oneOf:
          - $ref: '#/components/schemas/Cursor'
          - type: 'null'
        evidence_ref:
          type:
          - string
          - 'null'
        committed_at_utc:
          type:
          - string
          - 'null'
          format: date-time
        error_code:
          type:
          - string
          - 'null'
    RevocationFeed:
      type: object
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          maxItems: 500
          items:
            type: object
            required:
            - id
            - agent_id
            - serial
            - revoked_at
            properties:
              id:
                type: integer
              agent_id:
                type: string
              serial:
                type:
                - string
                - 'null'
              revoked_at:
                type: string
        next_cursor:
          type: integer
          minimum: 0
    UpdateResultRequest:
      type: object
      required:
      - sha256
      - status
      - reason
      - version
      additionalProperties: false
      properties:
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        status:
          type: string
          enum:
          - updated
          - rejected
          - rolled_back
        reason:
          type:
          - string
          - 'null'
          description: null only when status is updated.
        version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
    UpdateResultResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          const: recorded
    RemovalResultRequest:
      type: object
      required:
      - command_id
      - state
      - reason
      additionalProperties: false
      properties:
        command_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - state_cleaned
          - cleanup_failed
        reason:
          type:
          - string
          - 'null'
          description: null for state_cleaned; a removal reason code for cleanup_failed.
    RemovalResultResponse:
      type: object
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - state_cleaned
          - cleanup_failed

