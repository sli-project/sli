  /api/v1/admin/agents/replace:
    post:
      operationId: post_api_v1_admin_agents_replace
      tags:
      - agents-admin
      summary: Prepare or complete an explicitly confirmed agent replacement.
      description: >-
        Requires an authenticated platform owner or access.manage capability
        and the existing same-origin mutation check. The new agent must have
        enrolled with a key-bound token authorizing replacement of the old agent.
        Prepare drains the old runtime; complete transfers it after readiness checks.
        The response is sent after the transaction commits, with Cache-Control no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [old_agent_id, new_agent_id, phase, confirm]
              properties:
                old_agent_id:
                  type: string
                  format: uuid
                new_agent_id:
                  type: string
                  format: uuid
                  description: Must differ from old_agent_id.
                phase:
                  type: string
                  enum: [prepare, complete]
                confirm:
                  type: boolean
                  const: true
      responses:
        '200':
          description: Replacement phase committed; repeated completion is idempotent.
          content:
            application/json:
              schema:
                type: object
                required: [state, old_agent_id, new_agent_id]
                properties:
                  state:
                    type: string
                    enum: [draining, completed]
                  old_agent_id:
                    type: string
                    format: uuid
                  new_agent_id:
                    type: string
                    format: uuid
                  policy_revision:
                    type: integer
                    description: Returned when completing the transfer for the first time.
        '400':
          description: Invalid replacement request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Replacement preconditions or readiness checks failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Agent service unavailable; internal diagnostics are not exposed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-sli-capability: access.manage
  /api/v1/admin/agents/revoke:
    post:
      operationId: post_api_v1_admin_agents_revoke
      tags:
      - agents-admin
      summary: 'Change: admin agents revoke'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              description: TODO schema
      responses:
        '200':
          description: TODO schema
        '401':
          $ref: '#/components/responses/Unauthorized'
