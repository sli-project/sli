  /api/v1/domains:
    get:
      operationId: get_api_v1_domains
      tags:
      - domains
      summary: Read the union of domains accessible through readable domain reports.
      description: >-
        No request DTO, pagination or domain selector. The body of GET is not read.
        An empty grant returns {"items": []}, never null. Archived domains are included.
        All seven freshness fields are present; unavailable observations are JSON null.
        Rows are ordered by registered FQDN, then id. This is a read without collection side effects.
      security:
      - sessionCookie: []
      - bearerApiKey: []
      - headerApiKey: []
      x-sli-auth:
        roles: [viewer, operator, admin]
        capability: workspace.view
        report-subject-keys: denied with report_key_route_denied
        credential-order: bearer API key, header API key, then session cookie
        transport: HTTPS required when trusted proxies are configured; only trusted peers may supply X-Forwarded-Proto.
      x-sli-scope: >-
        Union of view grants on domain-scoped reports with the required field categories.
        A global grant selects all registered domains. No executable grant selects none.
        Source/entity/device/plugin restrictions cannot be widened into whole-domain access.
      x-sli-limits:
        query: No parsed parameter with a nonempty value is accepted.
        pagination: none
        response-items: No route-level cap; return the complete authorized domain set.
        scope-composition: At most 100 distinct collection scopes in a merged per-report clause; overflow returns 400.
        ingress: Existing configured shared request admission can return 429; this contract adds no limits.
      x-sli-raw-http:
        query-parser: urllib.parse.parse_qs with keep_blank_values=False and ampersand separator
        blank-query: '?x, ?x=, repeated empty values and empty segments are ignored.'
        nonblank-query: '?x=+, ?x=%20, ?x=%ZZ, ?=1 and a nonblank duplicate return 400.'
        precedence: Transport, authentication, viewer role and capability/scope composition precede query validation in .NET.
        path: Exact GET /api/v1/domains; the .NET raw-target guard rejects case, escaping or trailing-slash variants with 501.
      x-sli-contract-tests:
      - tests/unit/test_openapi_completeness.py
      - server-dotnet/tests/Sli.Server.Tests/Domains/DomainContractTests.cs
      x-sli-verification: >-
        Shared source-derived DTO/query vectors and isolated HTTP tests, without PostgreSQL.
        Actual SQL/ACL, real ingress, credential lookup, and unlisted raw HTTP combinations remain unknown.
        This operation's description does not assert global migration parity.
      responses:
        '200':
          description: Accessible domains, including an empty array when the grant or registry is empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainResponse'
        '400':
          description: Nonblank query parameters or invalid per-report domain-scope composition.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error: {const: domain_parameters_invalid}
        '401':
          description: No authenticated principal. Localized message follows Accept-Language (Russian fallback).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainAuthenticationError'
        '403':
          description: Transport, report-key restriction, viewer role, or workspace capability denied.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/DomainCapabilityError'
                - $ref: '#/components/schemas/DomainTransportError'
                - type: object
                  additionalProperties: false
                  required: [error]
                  properties:
                    error:
                      type: string
                      enum: [insufficient_permissions, report_key_route_denied, workspace_view_required]
        '429':
          description: Existing shared concurrency or per-client rolling-minute admission rejected the request.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error: {type: string, enum: [server_busy, rate_limit_exceeded]}
        '500':
          description: Unexpected failure; only a correlation id is exposed, never SQL or exception text.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error, internal_error_id]
                properties:
                  error: {const: internal_server_error}
                  internal_error_id: {type: string, format: uuid}
        '501':
          description: The .NET exact raw-target guard rejects a noncanonical spelling or method; not a missing canonical GET.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error: {const: not_implemented}
        '503':
          description: Existing read cancellation reported as an unavailable read, without partial items.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error, state]
                properties:
                  error: {const: report_read_timeout}
                  state: {const: unavailable}
      x-sli-capability: workspace.view
