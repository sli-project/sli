# OpenAPI 3.1 description of the SLI server API (task T088, part 1).
# Completeness is enforced by tests/unit/test_openapi_completeness.py.
openapi: 3.1.0
info:
  title: SLI Platform API
  version: 0.1.0-part1
  description: 'Description of every HTTP route of the SLI server so that the server can be reimplemented in any
    language without changing the interface or the agents (task T088). Part 1: all routes with method, path, path
    and known query parameters and a summary; request and response schemas are complete for the agent protocol (tag
    agent-protocol, see agent-dotnet/PROTOCOL.md). Other operation contracts are incomplete; unfilled contracts
    are marked ''TODO schema''.


    Routes registered as a prefix (x-sli-route-match: prefix) are listed once with a {path} or {name} parameter
    until later parts split them into concrete paths. Errors are JSON of the form {"error": "<code>"}.'
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: /
security:
- sessionCookie: []
- bearerApiKey: []
- headerApiKey: []
tags:
- name: agent-protocol
  description: Endpoints used by the SLI agent (mTLS or enrollment TLS).
- name: agents-admin
  description: Agent administration for the platform owner.
- name: ui-and-service
  description: Sign-in page, health probes, React shell and static pages.
paths:
  /api/plugins/{id}/settings:
    get:
      operationId: get_plugin_settings
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          enum: [sli.ad, sli.gpo, sli.workstations, sli.file-audit, sli.remote-access, sli.sigma]
      summary: Read a plugin's settings schema and current values.
      description: >-
        Requires the existing access.manage capability. Reads the canonical legacy
        platform_settings keys without rewriting values or timestamps. Unconfigured
        values are null; environment and default fallback retain their legacy semantics.
        Shared core keys are references in schema.x-core-settings, not plugin-owned values.
        Secret-marked declarations are not served by this non-secret settings endpoint.
      responses:
        '200':
          description: Validated JSON Schema and typed values for this plugin only.
          content:
            application/json:
              schema:
                type: object
                required: [plugin_id, schema, values, sources]
                additionalProperties: false
                properties:
                  plugin_id: {type: string}
                  schema: {type: object}
                  values:
                    type: object
                    additionalProperties: true
                  sources:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [database, environment, default, not_configured]
        '401': {description: Authentication required.}
        '403': {description: Existing access.manage capability required.}
        '404': {description: Plugin is not a bundled settings owner.}
        '503': {description: Settings declaration or stored value is unavailable.}
    put:
      operationId: put_plugin_setting
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          enum: [sli.ad, sli.gpo, sli.workstations, sli.file-audit, sli.remote-access, sli.sigma]
      summary: Update one declared plugin setting with an atomic audit record.
      description: >-
        Requires the existing admin role and access.manage capability, HTTPS and
        the same-origin mutation check. A single key is updated per request;
        other plugin and core keys are rejected. The typed value must satisfy
        the returned JSON Schema and existing storage/domain/policy validation.
        The existing platform_settings transaction preserves exception attribution
        and workstation policy version checks. No key migration or reset occurs.
        Audit contains the plugin and key, never submitted or previous values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              additionalProperties: false
              properties:
                key: {type: string, minLength: 1}
                value:
                  description: Typed value validated against this plugin's settings schema.
      responses:
        '200':
          description: The setting and its audit record were committed together.
          content:
            application/json:
              schema:
                type: object
                required: [plugin_id, key, value]
                additionalProperties: false
                properties:
                  plugin_id: {type: string}
                  key: {type: string}
                  value:
                    description: Persisted value, including server-managed attribution.
        '400': {description: Invalid key, value or policy update; no write committed.}
        '401': {description: Authentication required.}
        '403': {description: Admin role, access.manage or same-origin check denied.}
        '404': {description: Plugin is not a bundled settings owner.}
        '500': {description: Storage or audit transaction failed.}
