  /api/v1/notification-channels/smtp/setup/{path}:
    post:
      operationId: post_api_v1_notification_channels_smtp_setup_path
      tags:
      - notification-channels
      summary: Read or save SMTP settings through the isolated writer
      description: Admin session and CSRF required. Password is write-only; blank preserves a verified saved password. No mail is sent by these operations.
      parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
          enum: [status, save]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                additionalProperties: false
                description: Empty status request.
              - type: object
                additionalProperties: false
                required: [host, port, tls_mode, username, password, sender, recipients, enabled, revision]
                properties:
                  host:
                    type: string
                    maxLength: 253
                  port:
                    type: integer
                    minimum: 1
                    maximum: 65535
                  tls_mode:
                    type: string
                    enum: [tls, starttls]
                  username:
                    type: string
                    minLength: 1
                    maxLength: 1024
                  password:
                    type: string
                    writeOnly: true
                    maxLength: 65536
                  sender:
                    type: string
                    format: email
                  recipients:
                    type: array
                    maxItems: 1000
                    items:
                      type: object
                      additionalProperties: false
                      required: [user_id, mailbox]
                      properties:
                        user_id:
                          type: integer
                          minimum: 1
                          description: Existing bound identity or the authenticated user; not a new address-only recipient.
                        mailbox:
                          type: string
                          maxLength: 1024
                  enabled:
                    type: boolean
                  revision:
                    type: integer
                    minimum: 1
      responses:
        '200':
          description: Safe settings status or save receipt. Never returns a password, digest or private path.
          content:
            application/json:
              schema:
                type: object
                required: [secret_set, needs_save, revision]
                properties:
                  secret_set:
                    type: boolean
                  needs_save:
                    type: boolean
                  revision:
                    type: integer
                  self_user_id:
                    type: integer
        '400':
          description: Invalid settings or recipient mapping.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Settings changed; reload before saving.
        '503':
          description: Settings unavailable; no provider response or secret is returned.
      x-sli-capability: access.manage
      x-sli-route-match: prefix
