  /api/v1/semantic/sigma-rules:
    get:
      operationId: get_api_v1_semantic_sigma_rules
      tags: [semantic]
      summary: Discover authorized Sigma sources or read exact revision and policy bindings
      description: >-
        No query discovers RLS-visible, resource-authorized scopes. Supply all five
        scope parameters to read registered revisions in the latest retained TEST
        interval (at most 31 days). No catalog SHA is required. Current admission
        is returned only to platform owners, joined by the complete execution pin.
        Rule title/description are bounded strings read through the exact-revision
        scoped label function; unavailable or malformed metadata stays null.
        TEST counts and enabled/shadow/test detection inputs are separate; missing
        history leaves the interval and runtime counts unmeasured. This GET never
        changes admission; the existing owner-only semantic-control POST is used.
      parameters:
      - {in: query, name: installation_id, schema: {type: string, format: uuid}}
      - {in: query, name: plugin_id, schema: {type: string}}
      - {in: query, name: source_instance_id, schema: {type: string}}
      - {in: query, name: source_generation, schema: {type: string}}
      - {in: query, name: collection_scope_id, schema: {type: string}}
      responses:
        '200':
          description: sli.sigma.rules.v1 read-only projection; unavailable is never an empty measured result
        '400':
          description: Partial, duplicate, unknown or invalid scope filters
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      x-sli-capability: semantic.review
