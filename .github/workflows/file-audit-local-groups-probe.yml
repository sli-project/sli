name: File Audit LocalSystem group probe
on:
  push:
    branches: [codex/file-audit-debian-kit-23e9547d]
    paths: ['.github/workflows/file-audit-local-groups-probe.yml']
permissions: {}
jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Compare local NetAPI and qualified SID lookup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP ('sli-file-audit-local-groups-' + [Guid]::NewGuid().ToString('N'))
          $task = Split-Path -Leaf $work
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or $env:GITHUB_REPOSITORY -ne 'sli-project/sli') {
              throw 'Requires a disposable SLI hosted runner.'
          }
          New-Item -ItemType Directory -Path $work | Out-Null
          try {
              @'
          $ErrorActionPreference = 'Stop'
          if (-not [Security.Principal.WindowsIdentity]::GetCurrent().IsSystem) { throw 'Requires LocalSystem.' }
          Add-Type -TypeDefinition @"
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Security.Principal;
          
          public static class FileAuditLocalGroupsProbe
          {
              [DllImport("netapi32.dll", CharSet = CharSet.Unicode, ExactSpelling = true)]
              private static extern uint NetLocalGroupEnum(string server, uint level, out IntPtr buffer, uint preferred,
                  out uint entries, out uint total, ref UIntPtr resume);
              [DllImport("netapi32.dll", CharSet = CharSet.Unicode, ExactSpelling = true)]
              private static extern uint NetLocalGroupGetMembers(string server, string group, uint level, out IntPtr buffer,
                  uint preferred, out uint entries, out uint total, ref UIntPtr resume);
              [DllImport("netapi32.dll", ExactSpelling = true)]
              private static extern uint NetApiBufferFree(IntPtr buffer);
          
              private static SecurityIdentifier Resolve(string authority, string name)
              {
                  try
                  {
                      return (SecurityIdentifier)new NTAccount(authority, name).Translate(typeof(SecurityIdentifier));
                  }
                  catch (IdentityNotMappedException)
                  {
                      return null;
                  }
              }
          
              private static void Count(SortedDictionary<string, long> result, string key)
              {
                  result.TryGetValue(key, out var count);
                  result[key] = count + 1;
              }
          
              public static SortedDictionary<string, long> Run()
              {
                  var result = new SortedDictionary<string, long>();
                  result["pointer_bytes"] = IntPtr.Size;
                  result["localsystem"] = 1;
                  var builtinAlias = (NTAccount)new SecurityIdentifier(WellKnownSidType.BuiltinAdministratorsSid, null).Translate(typeof(NTAccount));
                  var builtinAuthority = builtinAlias.Value.Split('\\')[0];
                  var builtinSid = new SecurityIdentifier(WellKnownSidType.BuiltinDomainSid, null);
                  UIntPtr resume = UIntPtr.Zero;
                  var status = NetLocalGroupEnum(null, 0, out var buffer, 4096, out var count, out _, ref resume);
                  result["enum_win32"] = status;
                  result["enum_group_count"] = count;
                  try
                  {
                      if (status != 0 && status != 234) return result;
                      for (var i = 0; i < Math.Min(count, 100u); i++)
                      {
                          var name = Marshal.PtrToStringUni(Marshal.ReadIntPtr(buffer, i * IntPtr.Size));
                          if (String.IsNullOrEmpty(name)) { Count(result, "empty_name"); continue; }
                          var machine = Resolve(Environment.MachineName, name);
                          var builtin = Resolve(builtinAuthority, name);
                          if (builtin != null && !builtin.IsEqualDomainSid(builtinSid))
                          {
                              Count(result, "builtin_wrong_authority");
                              builtin = null;
                          }
                          var key = machine == null
                              ? builtin == null ? "neither" : "builtin_only_old_lookup_fails"
                              : builtin == null ? "machine_only" : machine.Equals(builtin) ? "same_sid" : "ambiguous";
                          Count(result, key);
                          UIntPtr memberResume = UIntPtr.Zero;
                          var memberStatus = NetLocalGroupGetMembers(null, name, 0, out var members, 4096,
                              out _, out _, ref memberResume);
                          try { Count(result, "members_win32_" + memberStatus); }
                          finally { if (members != IntPtr.Zero) NetApiBufferFree(members); }
                      }
                  }
                  finally { if (buffer != IntPtr.Zero) NetApiBufferFree(buffer); }
                  return result;
              }
          }
          "@
          [FileAuditLocalGroupsProbe]::Run() | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $PSScriptRoot 'result.json')
          '@ | Set-Content -LiteralPath (Join-Path $work 'probe.ps1')
              $pwsh = (Get-Command pwsh).Source
              $argsForTask = '-NoLogo -NoProfile -NonInteractive -File "{0}"' -f (Join-Path $work 'probe.ps1')
              $action = New-ScheduledTaskAction -Execute $pwsh -Argument $argsForTask -WorkingDirectory $work
              $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
              $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 2)
              Register-ScheduledTask -TaskName $task -Action $action -Principal $principal -Settings $settings | Out-Null
              Start-ScheduledTask -TaskName $task
              $resultFile = Join-Path $work 'result.json'
              $end = [DateTime]::UtcNow.AddSeconds(60)
              do {
                  Start-Sleep -Milliseconds 500
                  $done = (Test-Path -LiteralPath $resultFile -PathType Leaf) -and (Get-ScheduledTask -TaskName $task).State -eq 'Ready'
              } until ($done -or [DateTime]::UtcNow -ge $end)
              if (-not $done -or (Get-ScheduledTaskInfo -TaskName $task).LastTaskResult -ne 0) {
                  throw "LocalSystem probe failed with task result $((Get-ScheduledTaskInfo -TaskName $task).LastTaskResult)."
              }
              Get-Content -LiteralPath $resultFile -Raw
          }
          finally {
              if (Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue) {
                  Stop-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue
                  Unregister-ScheduledTask -TaskName $task -Confirm:$false
              }
              Remove-Item -LiteralPath (Join-Path $work 'probe.ps1'), (Join-Path $work 'result.json') -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $work
          }
