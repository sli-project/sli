name: Installed Windows file audit read-only proof
on:
  push:
    branches: ['codex/file-audit-debian-kit-23e9547d']
    paths:
      - '.github/workflows/file-audit-installed-windows.yml'
      - 'scripts/ci/file-audit-installed-windows.ps1'
      - 'scripts/ci/file-audit-installed-windows.cs'
permissions:
  contents: read
  actions: read
jobs:
  native-check:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      KIT_COMMIT: 23e9547d1b8231e297b901335c22e7a828a4b946
      MSI_ARTIFACT_ID: '14985910291'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: agent-dotnet/global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sli-agent-dotnet-msi-23e9547d1b8231e297b901335c22e7a828a4b946
          path: ${{ runner.temp }}/sli-msi-proof-input
          run-id: '45532450060'
          github-token: ${{ github.token }}
      - name: Install the pinned MSI and check one local share as the service account
        shell: pwsh
        run: |
          ./scripts/ci/file-audit-installed-windows.ps1
      - name: Attach bounded native diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: file-audit-installed-windows-23e9547d
          path: ${{ runner.temp }}/sli-msi-proof-evidence/
          if-no-files-found: ignore
          retention-days: 7
