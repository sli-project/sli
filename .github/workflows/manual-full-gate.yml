name: Manual disposable gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ${{ vars.SLI_TESTS_RUNNER || 'windows-latest' }}
    env:
      ADLOG_DISABLE_SCHEDULER: "1"
      ADLOG_DISABLE_COLLECTION: "1"
      ADLOG_CONTINUOUS_RECOVERY: "false"
      ADLOG_AI_EXECUTE_ENABLED: "false"
      ADLOG_DB_BACKEND: "postgres"
      ADLOG_PG_DSN: "postgresql://sli-pytest.invalid:5432/sli_pytest_unreachable"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pip install --disable-pip-version-check ruff==0.16.9
      - run: python -m ruff check --config .github/ruff-ci.toml server scripts tests
      - run: python scripts/maintenance/github_sanitary_check.py --root . --json
      - run: python -m compileall -q server scripts tests
      - run: python scripts/ci/shipped_python_tests.py --output .ci-shipped-python-tests.txt
      - run: >-
          python -m pytest -q -m "not postgres_integration"
          --deselect=tests/unit/test_linux_
          --deselect=tests/storage/test_raw_zip_durability.py
          --deselect=tests/storage/test_stabilization_runtime_security_ai.py::test_runtime_storage_cleanup_can_zip_archive_and_explain_exclusions
          --deselect=tests/unit/test_ad_credential_delivery.py
          --deselect=tests/unit/test_ad_credential_secrets.py::test_key_reader_requires_private_file_and_rejects_all_inline_values
          --deselect=tests/unit/test_ad_gpo_core_jobs.py
          --deselect=tests/unit/test_ad_gpo_pilot_acceptance.py
          --deselect=tests/unit/test_ad_plugin_registration.py::test_retained_hook_observes_generation_changes_and_drain
          --deselect=tests/unit/test_ad_plugin_registration.py::test_registry_retains_old_job_hash_but_schedules_active_generation
          --deselect=tests/unit/test_agent_group_bootstrap.py::test_msi_pending_restart_independent_attestation_personal_profile_and_signal
          --deselect=tests/unit/test_plugin_update.py
          --deselect=tests/unit/test_sli_agent_group_msi.py
          --deselect=tests/unit/test_sli_installation.py
          --deselect=tests/unit/test_sli_update.py::test_builder_cannot_follow_a_payload_link_to_the_signing_key
          --deselect=tests/unit/test_sli_update.py::test_traversal_refused
          --deselect=tests/unit/test_telegram_proxy.py::test_private_socket_status_validates_proxy_before_return
          --deselect=tests/unit/test_smtp_setup_deployment.py
          --deselect=tests/unit/test_smtp_setup_writer.py
          --deselect=tests/unit/test_telegram_proxy_installation.py
          --deselect=tests/unit/test_telegram_setup.py
          --deselect=tests/unit/test_release_artifacts.py
          --deselect=tests/tooling/test_t002_clickhouse_lifecycle.py::LifecycleTests::test_symlink_state_is_rejected
        env:
          PYTEST_ADDOPTS: "@.ci-shipped-python-tests.txt"

  frontend:
    runs-on: ${{ vars.SLI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Registry metadata tests import Python report modules.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend exec vitest run src
      - run: npm --prefix frontend run build

  postgres:
    runs-on: ${{ vars.SLI_LINUX_RUNNER || 'ubuntu-latest' }}
    # Keep bounded headroom for setup, integration, cleanup and cache upload.
    env:
      ADLOG_DISABLE_SCHEDULER: "1"
      ADLOG_DISABLE_COLLECTION: "1"
      ADLOG_CONTINUOUS_RECOVERY: "false"
      ADLOG_AI_EXECUTE_ENABLED: "false"
      ADLOG_DB_BACKEND: "postgres"
      # conftest clones the migrated or empty template into sli_test_* per test.
      ADLOG_TEST_PG_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_ci"
      ADLOG_TEST_PG_EMPTY_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_empty_ci"
      ADLOG_PG_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_ci"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: server-dotnet/global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      - name: Build shipped server and packet report test
        run: |
          dotnet restore server-dotnet/tests/Sli.Server.Tests/Sli.Server.Tests.csproj --locked-mode
          dotnet build server-dotnet/tests/Sli.Server.Tests/Sli.Server.Tests.csproj --no-restore
      - name: Ensure PostgreSQL 18 binaries
        shell: bash
        run: |
          if [ ! -d /usr/lib/postgresql/18/bin ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
            sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            # Do not create a system cluster; this job owns only its temporary cluster.
            echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18
          fi
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Start disposable PostgreSQL 18
        shell: bash
        run: |
          PGDATA=$(mktemp -d "$RUNNER_TEMP/sli-postgres.XXXXXX")
          echo "PGDATA=$PGDATA" >> "$GITHUB_ENV"
          initdb -D "$PGDATA" --username=postgres --auth=trust --encoding=UTF8
          printf "listen_addresses = '127.0.0.1'\nport = 5432\nunix_socket_directories = ''\n" >> "$PGDATA/postgresql.conf"
          pg_ctl -D "$PGDATA" -l "$PGDATA/server.log" -w start
      - name: Bootstrap baseline and migrations
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          import tempfile
          from pathlib import Path

          import psycopg
          from scripts.maintenance import existing_postgres_bootstrap as bootstrap

          root = Path.cwd()
          dsn = os.environ["ADLOG_TEST_PG_DSN"]
          runtime_password = secrets.token_urlsafe(32)
          migrations = bootstrap.forward_migration_inventory(root / "config/postgres_migrations")
          baseline = bootstrap.load_baseline(root / "config/postgres_baseline", migrations)
          with psycopg.connect(dsn, dbname="postgres", autocommit=True) as admin:
              if admin.execute("select current_setting('server_version_num')::int").fetchone()[0] // 10000 != 18:
                  raise bootstrap.BootstrapError("postgresql_18_required")
              bootstrap.create_target_database(
                  admin, database="sli_test_ci", runtime_password=runtime_password,
              )
              admin.execute("create database sli_test_empty_ci with template template0 encoding 'UTF8'")
          with psycopg.connect(dsn, autocommit=True) as admin:
              with tempfile.TemporaryDirectory(prefix="sli-ci-baseline-") as temporary:
                  bootstrap.apply_baseline_sequence(
                      baseline=baseline,
                      rendered_schema_path=bootstrap.render_baseline_schema(
                          baseline, "example.test", Path(temporary) / "baseline.sql",
                      ),
                      migrations=migrations, psql=Path("/usr/lib/postgresql/18/bin/psql"), host="127.0.0.1",
                      port=5432, database="sli_test_ci", admin_password="",
                      runtime_password=runtime_password,
                      platform_owner_password=secrets.token_urlsafe(32),
                      admin_execute=admin.execute,
                  )
              expected = sorted([
                  *bootstrap.base_schema_markers(root / "config/postgres_schema.sql"),
                  *((item.version, item.name) for item in migrations),
              ])
              actual = admin.execute(
                  "select version, name from public.schema_migrations order by version"
              ).fetchall()
              bootstrap.verify_exact_ledger(actual, expected)
          PY
      - name: Signed AD packet reaches the journal on current PostgreSQL
        shell: bash
        run: |
          result=$(mktemp "$RUNNER_TEMP/sli-packet-report.XXXXXX")
          dotnet run --project server-dotnet/tests/Sli.Server.Tests/Sli.Server.Tests.csproj \
            --no-build -- -class Sli.Server.Tests.Agents.AgentPacketReportPostgresTests -failSkips -result-xml "$result"
          python - "$result" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          tests = ET.parse(sys.argv[1]).iter("test")
          if not any(test.get("type") == "Sli.Server.Tests.Agents.AgentPacketReportPostgresTests"
                     and test.get("result") == "Pass" for test in tests):
              raise SystemExit("The signed AD packet report scenario did not pass")
          PY
      - run: python scripts/ci/shipped_python_tests.py --output .ci-shipped-python-tests.txt
      - name: Linux unit and filesystem contracts
        shell: bash
        run: |
          grep '^tests/unit/test_linux_' .ci-shipped-python-tests.txt > .ci-shipped-linux-unit-tests.txt
          python -m pytest -q -m "not postgres_integration and not host_dependent" \
            @.ci-shipped-linux-unit-tests.txt \
            tests/storage/test_raw_zip_durability.py \
            tests/storage/test_stabilization_runtime_security_ai.py::test_runtime_storage_cleanup_can_zip_archive_and_explain_exclusions \
            tests/unit/test_ad_credential_delivery.py \
            tests/unit/test_ad_credential_secrets.py::test_key_reader_requires_private_file_and_rejects_all_inline_values \
            tests/unit/test_ad_gpo_core_jobs.py \
            tests/unit/test_ad_gpo_pilot_acceptance.py \
            tests/unit/test_ad_plugin_registration.py::test_retained_hook_observes_generation_changes_and_drain \
            tests/unit/test_ad_plugin_registration.py::test_registry_retains_old_job_hash_but_schedules_active_generation \
            tests/unit/test_agent_group_bootstrap.py::test_msi_pending_restart_independent_attestation_personal_profile_and_signal \
            tests/unit/test_plugin_update.py \
            tests/unit/test_sli_agent_group_msi.py \
            tests/unit/test_sli_installation.py \
            tests/unit/test_sli_update.py::test_builder_cannot_follow_a_payload_link_to_the_signing_key \
            tests/unit/test_sli_update.py::test_traversal_refused \
            tests/unit/test_telegram_proxy.py::test_private_socket_status_validates_proxy_before_return \
            tests/unit/test_smtp_setup_deployment.py \
            tests/unit/test_smtp_setup_writer.py \
            tests/unit/test_telegram_proxy_installation.py \
            tests/unit/test_telegram_setup.py \
            tests/unit/test_release_artifacts.py \
            tests/tooling/test_t002_clickhouse_lifecycle.py::LifecycleTests::test_symlink_state_is_rejected
      - name: T002 actual PostgreSQL context at synthetic enterprise scale
        run: python -m pytest -q -s tests/reporting/test_new_logon_pairs_context_native.py
      - name: T051 bounded synthetic context plans and typed timeout
        run: python -m pytest -q -s tests/reporting/test_new_logon_pairs_diagnostics_postgres.py
      - name: Measure synthetic collection aggregation equivalence
        run: python -m pytest -q -s tests/reporting/test_agent_collection_query_plan_postgres.py
      - name: Measure synthetic plugin receipt plans
        run: python -m pytest -q -s tests/reporting/test_plugin_receipts_query_plan_postgres.py
      - name: Verify full-schema ACL directory backup and parallel restore
        run: python -m pytest -q tests/migrations/test_qw_restore_context_migration.py -m postgres_integration
      - name: Remaining PostgreSQL integration tests
        shell: bash
        run: |
          # --ignore does not drop a file passed explicitly, so the three files run
          # in their own steps above are removed from the shipped list here.
          grep -vxF -e tests/migrations/test_qw_restore_context_migration.py -e tests/reporting/test_agent_collection_query_plan_postgres.py -e tests/reporting/test_plugin_receipts_query_plan_postgres.py .ci-shipped-python-tests.txt > .ci-shipped-postgres-tests.txt
          python -m pytest -v -m "postgres_integration and not e2e" @.ci-shipped-postgres-tests.txt
      - name: Stop disposable PostgreSQL 18
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${PGDATA:-}" ] && [ -f "$PGDATA/postmaster.pid" ]; then
            pg_ctl -D "$PGDATA" -m immediate -w stop
          fi

  t002-native:
    if: startsWith(github.head_ref || github.ref_name, 'codex/t002-')
    runs-on: ubuntu-latest
    # Keep bounded headroom for setup, integration, cleanup and cache upload.
    env:
      ADLOG_DISABLE_SCHEDULER: "1"
      ADLOG_DISABLE_COLLECTION: "1"
      ADLOG_CONTINUOUS_RECOVERY: "false"
      ADLOG_AI_EXECUTE_ENABLED: "false"
      ADLOG_DB_BACKEND: "postgres"
      # conftest clones the migrated or empty template into sli_test_* per test.
      ADLOG_TEST_PG_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_ci"
      ADLOG_TEST_PG_EMPTY_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_empty_ci"
      ADLOG_PG_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_ci"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: T002 existing local Docker capability preflight
        if: startsWith(github.head_ref || github.ref_name, 'codex/t002-')
        run: >-
          python3 scripts/ci/t002_clickhouse.py preflight
          --state "$RUNNER_TEMP/sli-t002-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Ensure PostgreSQL 18 binaries
        shell: bash
        run: |
          if [ ! -d /usr/lib/postgresql/18/bin ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
            sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            # Do not create a system cluster; this job owns only its temporary cluster.
            echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18
          fi
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Start disposable PostgreSQL 18
        shell: bash
        run: |
          PGDATA=$(mktemp -d "$RUNNER_TEMP/sli-postgres.XXXXXX")
          echo "PGDATA=$PGDATA" >> "$GITHUB_ENV"
          initdb -D "$PGDATA" --username=postgres --auth=trust --encoding=UTF8
          printf "listen_addresses = '127.0.0.1'\nport = 5432\nunix_socket_directories = ''\n" >> "$PGDATA/postgresql.conf"
          pg_ctl -D "$PGDATA" -l "$PGDATA/server.log" -w start
      - name: Bootstrap baseline and migrations
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          import tempfile
          from pathlib import Path

          import psycopg
          from scripts.maintenance import existing_postgres_bootstrap as bootstrap

          root = Path.cwd()
          dsn = os.environ["ADLOG_TEST_PG_DSN"]
          runtime_password = secrets.token_urlsafe(32)
          migrations = bootstrap.forward_migration_inventory(root / "config/postgres_migrations")
          baseline = bootstrap.load_baseline(root / "config/postgres_baseline", migrations)
          with psycopg.connect(dsn, dbname="postgres", autocommit=True) as admin:
              if admin.execute("select current_setting('server_version_num')::int").fetchone()[0] // 10000 != 18:
                  raise bootstrap.BootstrapError("postgresql_18_required")
              bootstrap.create_target_database(
                  admin, database="sli_test_ci", runtime_password=runtime_password,
              )
              admin.execute("create database sli_test_empty_ci with template template0 encoding 'UTF8'")
          with psycopg.connect(dsn, autocommit=True) as admin:
              with tempfile.TemporaryDirectory(prefix="sli-ci-baseline-") as temporary:
                  bootstrap.apply_baseline_sequence(
                      baseline=baseline,
                      rendered_schema_path=bootstrap.render_baseline_schema(
                          baseline, "example.test", Path(temporary) / "baseline.sql",
                      ),
                      migrations=migrations, psql=Path("/usr/lib/postgresql/18/bin/psql"), host="127.0.0.1",
                      port=5432, database="sli_test_ci", admin_password="",
                      runtime_password=runtime_password,
                      platform_owner_password=secrets.token_urlsafe(32),
                      admin_execute=admin.execute,
                  )
              expected = sorted([
                  *bootstrap.base_schema_markers(root / "config/postgres_schema.sql"),
                  *((item.version, item.name) for item in migrations),
              ])
              actual = admin.execute(
                  "select version, name from public.schema_migrations order by version"
              ).fetchall()
              bootstrap.verify_exact_ledger(actual, expected)
          PY
      - name: T002 native synthetic report with disposable ClickHouse
        if: startsWith(github.head_ref || github.ref_name, 'codex/t002-')
        run: >-
          python scripts/ci/t002_clickhouse.py run
          --state "$RUNNER_TEMP/sli-t002-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - name: Remove T002 disposable ClickHouse
        if: ${{ always() }}
        run: >-
          python3 scripts/ci/t002_clickhouse.py cleanup
          --state "$RUNNER_TEMP/sli-t002-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - name: Stop disposable PostgreSQL 18
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${PGDATA:-}" ] && [ -f "$PGDATA/postmaster.pid" ]; then
            pg_ctl -D "$PGDATA" -m immediate -w stop
          fi


