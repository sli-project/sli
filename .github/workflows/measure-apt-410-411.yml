name: Measure signed APT index with rollback

on:
  push:
    branches: ['test/apt-upgrade-410-to-411-debian']
    paths:
      - '.github/workflows/measure-apt-410-411.yml'

permissions:
  contents: read
  actions: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_RUN: '45480994082'
      BASE_ARTIFACT: '14960504617'
      BASE_ZIP_SHA256: 'be00dc59ab7a1cf841bfb44015f02b48e673aa327d9e5167d6e7b00332620a73'
      BASE_COMMIT: '0f6093b3a9afcecb28fcdd47c7ed50522e50a156'
      CANDIDATE_RUN: '45510515483'
      CANDIDATE_ARTIFACT: '14976746044'
      CANDIDATE_ZIP_SHA256: '55e03f5f6f1dddfd385cc16ac72cce55b6402abd44ff47a9d91c1b94ef2bc8fc'
      CANDIDATE_COMMIT: '1c25b9f1661ac2412bfc584f3fcbffda1ea95229'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 686643a7e5b4db247a98ff2b92713af3a1eb75cb
          persist-credentials: false
      - name: Download and verify both original artifact ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/p1-rollback-evidence"
          mkdir -p "$evidence"
          download() {
            local label=$1 run=$2 artifact=$3 commit=$4 digest=$5
            local kit="$RUNNER_TEMP/p1-kits/$label" zip
            mkdir -p "$kit"
            zip="$kit/artifact.zip"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" |
              jq -e --argjson id "$artifact" --arg name "sli-debian-beta-kit-$commit" \
                --arg digest "sha256:$digest" \
                'any(.artifacts[]; .id == $id and .name == $name and .digest == $digest and .expired == false)' \
                >/dev/null
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
              --retry 2 --max-time 180 -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" -o "$zip"
            printf '%s  %s\n' "$digest" "$zip" | sha256sum --check --strict
            unzip -p "$zip" sli-debian-beta-kit.tar.gz >"$kit/sli-debian-beta-kit.tar.gz"
            unzip -p "$zip" SHA256SUMS >"$kit/SHA256SUMS"
            (cd "$kit"; sha256sum sli-debian-beta-kit.tar.gz | cmp - SHA256SUMS)
            rm -- "$zip"
            printf '%s run=%s artifact=%s git=%s zip_sha256=%s\n' \
              "$label" "$run" "$artifact" "$commit" "$digest" | tee -a "$evidence/artifacts.txt"
          }
          download predecessor "$BASE_RUN" "$BASE_ARTIFACT" "$BASE_COMMIT" "$BASE_ZIP_SHA256"
          download candidate "$CANDIDATE_RUN" "$CANDIDATE_ARTIFACT" "$CANDIDATE_COMMIT" "$CANDIDATE_ZIP_SHA256"
      - name: Build and verify the two-version signed index locally
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/apt-rollback-index"
          evidence="$RUNNER_TEMP/p1-rollback-evidence"
          mkdir -p "$work/gnupg"
          for row in "predecessor $BASE_COMMIT 38115eee4fe10dbf5a422d13ccbb644ff5c0837cb371cb397579c0fb56b0338e" \
                     "candidate $CANDIDATE_COMMIT b3d5b8eb293bebee5142ffd9717620bf3491361bc445dc96bbc35171178177bd"; do
            read -r label commit tar_sha <<<"$row"
            archive="$RUNNER_TEMP/p1-kits/$label/sli-debian-beta-kit.tar.gz"
            printf '%s  %s\n' "$tar_sha" "$archive" | sha256sum --check --strict
            python3 -B -c 'from pathlib import Path; import sys; from deploy.linux.build_beta_kit import verify_offline_kit; verify_offline_kit(Path(sys.argv[1]), sys.argv[2])' "$archive" "$commit"
            mkdir -p "$work/$label"
            tar --no-same-owner -xzf "$archive" -C "$work/$label"
            gh api "repos/$GITHUB_REPOSITORY/contents/deploy/linux/native_pins.json?ref=$commit" \
              --jq .content | base64 -d >"$work/$label-pins.json"
          done
          gpg --homedir "$work/gnupg" --batch --no-options --pinentry-mode loopback --passphrase '' \
            --quick-generate-key 'Local APT proof <apt@example.invalid>' ed25519 sign 1d
          gpg --homedir "$work/gnupg" --batch --no-options --export-secret-keys >"$work/test.key"
          gpgconf --homedir "$work/gnupg" --kill gpg-agent
          python3 -B -m deploy.linux.build_apt_repo \
            --debs "$work/predecessor/sli-debian-beta-kit" --output "$work/previous" \
            --pins "$work/predecessor-pins.json" --signing-key "$work/test.key"

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=127.0.0.1' \
            -addext 'subjectAltName=IP:127.0.0.1' -keyout "$work/tls.key" -out "$work/tls.crt" \
            >"$work/tls.log" 2>&1
          python3 -B - "$work" <<'PY' >"$work/https.log" 2>&1 &
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          import ssl
          import sys

          root = Path(sys.argv[1])
          with ThreadingHTTPServer(("127.0.0.1", 0), partial(SimpleHTTPRequestHandler, directory=root / "previous")) as server:
              context = ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER)
              context.load_cert_chain(root / "tls.crt", root / "tls.key")
              server.socket = context.wrap_socket(server.socket, server_side=True)
              (root / "https-port").write_text(str(server.server_port))
              server.serve_forever()
          PY
          mirror_pid=$!
          trap 'kill "$mirror_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 25); do
            [[ -s "$work/https-port" ]] && break
            sleep 1
          done
          previous_url="https://127.0.0.1:$(cat "$work/https-port")"
          CURL_CA_BUNDLE="$work/tls.crt" NO_PROXY=127.0.0.1 python3 -B -m deploy.linux.build_apt_repo \
            --debs "$work/candidate/sli-debian-beta-kit" --output "$work/final" \
            --pins "$work/candidate-pins.json" --signing-key "$work/test.key" --previous-url "$previous_url"
          rm -f -- "$work/test.key"
          gpgv --keyring "$work/final/sli-archive-keyring.gpg" "$work/final/dists/trixie/InRelease"
          gpgv --keyring "$work/final/sli-archive-keyring.gpg" \
            "$work/final/dists/trixie/Release.gpg" "$work/final/dists/trixie/Release"
          tar -cf "$work/index.tar" -C "$work/final" .
          python3 -B - "$work" <<'PY' | tee "$evidence/two-version-index.json"
          import hashlib
          import json
          from pathlib import Path
          import sys

          from deploy.linux import build_apt_repo as apt

          root = Path(sys.argv[1])
          final = root / "final"
          index = final / "dists/trixie" / apt.INDEX_PATH
          rows = [apt.fields(stanza) for stanza in index.read_text().rstrip().split("\n\n")]
          manifests = [json.loads((root / label / "sli-debian-beta-kit/manifest.json").read_text())
                       for label in ("predecessor", "candidate")]
          exact_versions = {manifest["version"] for manifest in manifests}
          assert len(exact_versions) == 2
          assert {row["version"] for row in rows if row["package"] == "sli"} == exact_versions
          expected = {}
          for manifest in manifests:
              for package in manifest["packages"]:
                  previous = expected.setdefault(package["filename"], package["sha256"])
                  assert previous == package["sha256"]
          pool = sorted((final / "pool").glob("*.deb"))
          assert {p.name: apt.sha256(p) for p in pool} == expected
          for row in rows:
              file = final / row["filename"]
              assert int(row["size"]) == file.stat().st_size and row["sha256"] == expected[file.name]
          largest = max(pool, key=lambda p:p.stat().st_size)
          site_bytes = sum(p.stat().st_size for p in final.rglob("*") if p.is_file())
          tar_bytes = (root / "index.tar").stat().st_size
          assert largest.stat().st_size <= apt.MAX_FILE_SIZE == 104857600
          assert site_bytes <= apt.MAX_SITE_SIZE == 1000000000
          print(json.dumps(dict(versions=sorted(exact_versions), package_count=len(pool),
              pool_bytes=sum(p.stat().st_size for p in pool), site_bytes=site_bytes,
              tar_bytes=tar_bytes, packages_index_bytes=index.stat().st_size,
              compressed_index_bytes=index.with_suffix(".gz").stat().st_size,
              largest={"name":largest.name, "bytes":largest.stat().st_size, "sha256":expected[largest.name]},
              index_sha256=hashlib.sha256(index.read_bytes()).hexdigest()), sort_keys=True))
          PY
      - name: Preserve measured sizes and input archive provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apt-index-size-with-one-rollback
          path: ${{ runner.temp }}/p1-rollback-evidence/
          if-no-files-found: ignore
          retention-days: 7
