name: Replay the saved beta menu evidence
on:
  push:
    branches: [codex/verify-installed-first-ad-2323cfa]
    paths: [.github/workflows/archived-beta-menu-evidence.yml]
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fa8baf797ca0f0bcd62574aebf551e3aef1e6638
          path: exact-source
          persist-credentials: false
      - name: Verify the original runs and archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          check_source() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1" |
              jq -e --arg head "$2" '.head_sha==$head and .status=="completed" and .conclusion=="failure"' >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$3" |
              jq -e --argjson run "$1" --arg digest "$4" \
                '.workflow_run.id==$run and .digest==$digest and .expired==false' >/dev/null
          }
          check_source 45550092780 04b0413472d906304074a227f443d8d4c7b6798c 14992663749 sha256:960835ac27e01a06a64f7479b917e5cf8eea3dc736af73d01ad47bbfebdd2bdd
          check_source 45551572971 e8664756920bdd00b15ffebc0b649b9c32533f48 14994082029 sha256:d1e471e5e1f960d70af702a81cbe36a318fb3c145a94c3d0df676a8f072eea86
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '45550092780'
          name: installed-beta-menu-native-accounting-evidence
          path: archived/full
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '45551572971'
          name: installed-file-audit-render-evidence
          path: archived/target
      - name: Run the unchanged menu checker on the saved exact observations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C exact-source rev-parse HEAD)" = fa8baf797ca0f0bcd62574aebf551e3aef1e6638
          test "$(git -C exact-source hash-object scripts/maintenance/beta_acceptance.py)" = e644a1c01bb43a9dccfdb0bdafacdee71e16b5d2
          test "$(git -C exact-source hash-object config/navigation_v3.json)" = 0ed2280e50535e48621874e7f2d9d32cc4bdf24e
          python3 -I -B - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import re
          import tarfile

          commit = "fa8baf797ca0f0bcd62574aebf551e3aef1e6638"
          package_zip = "246794c40ca8a957a5bb0f411943c2277cb3fdc6022b0b9eb7d23f4773bf704f"
          script = Path("exact-source/scripts/maintenance/beta_acceptance.py")
          spec = importlib.util.spec_from_file_location("exact_beta_acceptance", script)
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)

          def recorded_health(directory):
              lines = (directory / "guest.log").read_text(encoding="utf-8").splitlines()
              expected_identity = f"BETA_README_EVIDENCE installed_release=beta1-{commit[:12]} installed_commit={commit}"
              assert expected_identity in lines
              assert "BETA_README_EVIDENCE agents_receipts_hot_events_findings_schema=0,0,0,0,415" in lines
              # Each pinned harness emits this marker only after real GET /api/health returned
              # HTTP 200, status ok and that exact runtime_identity.git_commit.
              assert "BETA_README_EVIDENCE vpn_readiness_same_runtime=verified" in lines
              return {"status": "ok", "runtime_identity": {"git_commit": commit}}

          def recorded_package(directory):
              pins = (directory / "pins.txt").read_text(encoding="utf-8").splitlines()
              assert {
                  f"archived_commit={commit}", "source_workflow=45548527621", "source_artifact=14992149151",
                  f"source_zip_digest=sha256:{package_zip}",
              } <= set(pins)
              digests = [line.split()[0] for line in pins
                         if re.fullmatch(r"[a-f0-9]{64} +sli-debian-beta-kit\.tar\.gz", line)]
              assert len(digests) == 1
              return digests[0]

          def read_evidence(directory, member_name):
              with tarfile.open(directory / "menu-screens.tar.gz", "r:gz") as archive:
                  candidates = [member for member in archive if member.name.removeprefix("./") == member_name]
                  assert len(candidates) == 1 and candidates[0].isfile() and candidates[0].size <= 2_000_000
                  return json.load(archive.extractfile(candidates[0]))

          full_dir = Path("archived/full")
          target_dir = Path("archived/target")
          full_health = recorded_health(full_dir)
          assert full_health == recorded_health(target_dir)
          kit_tar = recorded_package(full_dir)
          assert kit_tar == recorded_package(target_dir)
          full = read_evidence(full_dir, "full/menu.json")
          target = read_evidence(target_dir, "file-audit/menu.json")
          assert full["commit"] == target["commit"] == commit
          assert full["summary"]["failed"] == ["file-audit"] and full["summary"]["clicked"] == 19
          assert set(full["pages"]) == set(checker.menu_entries()) and len(full["rows"]) == len(full["pages"]) == 19
          assert sum(row["passed"] is True for row in full["rows"]) == 18
          assert target["target"] == "/app/report/file-audit.overview" and target["vpn"] == "enabled_in_guest"
          assert target["failed"] == "precondition_or_browser_error" and "passed" not in target
          assert target["explicit_responses_settled"] is True and target["render_wait"] == "matched"
          data, = target["requests"]["data"]
          agents, = target["requests"]["agents"]
          assert data["http"] == agents["http"] == 200 and data["body"] == agents["body"] == "settled"
          assert data["fields"]["state"] == "not_collected" and data["fields"]["items"] == 0
          assert agents["fields"]["agents"] == 0 and agents["fields"]["assigned_file_audit"] == 0
          final = target["snapshots"]["final"]
          assert target["snapshots"]["after_bodies"]["ms"] >= max(data["json_ms"], agents["json_ms"])
          assert final["ms"] >= target["snapshots"]["after_bodies"]["ms"]
          assert final["cta_count"] == 1 and final["no_sources"] is True and final["report_title"] is True
          assert final["denied"] is False and target["blocked_same_origin"] == 0
          assert type(target["final_load_errors"]) is int and type(target["final_completeness_labels"]) is int

          def replay_recorded_health(path):
              assert path == "/api/health"
              return full_health

          try:
              checker.menu(replay_recorded_health, full)
          except checker.CheckFailed as failure:
              assert str(failure) == "Не пройдены пункты меню: file-audit"
              print("SOURCE_FULL_CHECK " + str(failure))
          else:
              raise RuntimeError("The original full observation unexpectedly passed")

          pages = dict(full["pages"])
          pages["file-audit"] = {
              "data": data["fields"]["items"] > 0,
              "action_phrases": final["cta_count"],
              "load_errors": target["final_load_errors"] + target["blocked_same_origin"],
              "completeness_labels": target["final_completeness_labels"],
          }
          assert all(pages[key] == full["pages"][key] for key in pages if key != "file-audit")
          summary = checker.menu(replay_recorded_health, {"commit": commit, "pages": pages})
          protocol = {
              "commit": commit, "schema": 415, "kit_artifact": 14992149151, "kit_zip_sha256": package_zip,
              "kit_tar_sha256": kit_tar, "health": "projection_of_saved_http_200_identity_verification",
              "full": {"run": 45550092780, "artifact": 14992663749, "ci": "failure", "unchanged_rows": 18},
              "file_audit": {"run": 45551572971, "artifact": 14994082029, "ci": "failure",
                             "late_error": "screenshot_mask_passed_locator_instead_of_array",
                             "data_json_ms": data["json_ms"], "agents_json_ms": agents["json_ms"],
                             "final_ms": final["ms"], "page": pages["file-audit"]},
              "pages": pages, "checker": summary,
          }
          print("COMBINED_BETA_MENU " + json.dumps(protocol, ensure_ascii=False, separators=(",", ":")))
          PY
