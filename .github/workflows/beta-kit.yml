name: Debian beta kit

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full SHA on main (default is the dispatched main commit)'
        required: false
        type: string
      upload_artifact:
        description: 'Upload the finished kit to GitHub Actions'
        default: false
        type: boolean
      release:
        description: 'Create a GitHub release with the verified kit'
        default: false
        type: boolean
      publish:
        description: 'Release publication mode'
        type: choice
        default: draft
        options:
          - draft
          - prerelease

permissions: {}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/beta-kit-build.yml
    with:
      commit: ${{ inputs.commit || github.sha }}
      upload_artifact: ${{ inputs.upload_artifact || inputs.release }}

  release:
    if: inputs.release && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sli-debian-beta-kit-${{ needs.build.outputs.commit }}
          path: release
      - name: Create GitHub release
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KIT_COMMIT: ${{ needs.build.outputs.commit }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          [[ "$KIT_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          sha256sum sli-debian-beta-kit.tar.gz | cmp - SHA256SUMS
          tag="beta-${KIT_COMMIT:0:12}"
          notes=$(printf 'Source commit: `%s`\n\nGitHub Actions build: %s/%s/actions/runs/%s\n' \
            "$KIT_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          case "$PUBLISH" in
            draft) release_flag=--draft ;;
            prerelease) release_flag=--prerelease ;;
            *) printf 'Invalid release publication mode\n' >&2; exit 1 ;;
          esac
          gh release create "$tag" sli-debian-beta-kit.tar.gz SHA256SUMS \
            --target "$KIT_COMMIT" "$release_flag" --title "$tag" --notes "$notes"
