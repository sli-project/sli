name: P3 Telegram grouped problem loopback

on:
  push:
    branches: ['test/p3-telegram-link-4a6f14c8']

permissions:
  contents: read

jobs:
  proof:
    runs-on: ${{ vars.SLI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      SOURCE_SHA: 4a6f14c815e07ff2a01346700d79507689d657e9
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_gcServer: "0"
      TZ: UTC
    defaults:
      run:
        shell: bash
        working-directory: server-dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Confirm proof uses the pinned product source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test -z "$(git diff --name-only "$SOURCE_SHA" HEAD -- src ../config ../frontend ../deploy ../agent-dotnet)"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: server-dotnet/global.json
      - name: PostgreSQL 18 for tests on the real schema
        # The baseline uses settings newer than the image's default server.
        run: |
          # The project's own runner image ships PostgreSQL 18 and has no sudo.
          if [ -x /usr/lib/postgresql/18/bin/initdb ]; then exit 0; fi
          sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          # Do not create a system cluster; this job owns only its temporary cluster.
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18
      - name: Run the grouped problem case through sender and report route
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/p3"
          mkdir -p "$output"
          export SLI_P3_PROOF_JSON="$output/protocol.json"
          project=tests/Sli.Server.Tests/Sli.Server.Tests.csproj
          dotnet restore "$project" --locked-mode --disable-build-servers
          dotnet build "$project" -c Release --no-restore --disable-build-servers
          dotnet tests/Sli.Server.Tests/bin/Release/net10.0/Sli.Server.Tests.dll \
            -method Sli.Server.Tests.Notifications.TelegramUpdatePostgresTests.GroupedProblemTelegramPayloadOpensItsExactProblem \
            -failSkips -noColor -noAutoReporters -reporter verbose -result-xml "$output/result.xml"
          test -s "$SLI_P3_PROOF_JSON"
          cat "$SLI_P3_PROOF_JSON"
      - name: Preserve the loopback protocol
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p3-telegram-loopback-4a6f14c8
          path: ${{ runner.temp }}/p3/
          if-no-files-found: warn
          retention-days: 7
