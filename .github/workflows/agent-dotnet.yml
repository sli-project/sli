name: Agent .NET

# Portable contract tests and publication of the Windows payload.
# MSI linking runs in agent-msi.yml; real Windows acceptance remains a local check.
on:
  pull_request:
    paths:
      - "agent-dotnet/**"
      - ".github/workflows/agent-dotnet.yml"
      - "tests/unit/test_agent_dotnet_vectors.py"
      - "sli_agent/**"
      - "sli_collect/**"
      - "server/sli/agent_ingest.py"
      - "server/sli/agents/**"
      - "server/sli/plugins/ad/agent_policy.py"
      - "config/event_catalog.json"
      - "config/event_storage_meanings.json"
      - "config/source_packs/dc.json"
  push:
    branches: [main]
    paths:
      - "agent-dotnet/**"
      - ".github/workflows/agent-dotnet.yml"
      - "tests/unit/test_agent_dotnet_vectors.py"
      - "sli_agent/**"
      - "sli_collect/**"
      - "server/sli/agent_ingest.py"
      - "server/sli/agents/**"
      - "server/sli/plugins/ad/agent_policy.py"
      - "config/event_catalog.json"
      - "config/event_storage_meanings.json"
      - "config/source_packs/dc.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-dotnet-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Build with warnings as errors, run portable tests, and verify the .NET packets on the server side.
  # WindowsOnly tests require the dedicated acceptance VM.
  portable:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/artifacts/dotnet
      INTEROP_DIR: ${{ github.workspace }}/artifacts/dotnet-interop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: agent-dotnet/global.json
      - run: dotnet build SliAgent.slnx -c Release
        working-directory: agent-dotnet
      - name: Test (also exports .NET packets for the server code to check)
        working-directory: agent-dotnet
        env:
          SLI_DOTNET_INTEROP_DIR: ${{ env.INTEROP_DIR }}
        run: >-
          dotnet test SliAgent.slnx -c Release --no-build
          --filter "Category!=WindowsOnly"
          --logger "trx;LogFileName=agent-dotnet.trx"
          --results-directory ../artifacts/test-results
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: The server's own code accepts the .NET packets and enrollment request
        env:
          SLI_DOTNET_INTEROP_DIR: ${{ env.INTEROP_DIR }}
        run: python -m pytest -q tests/unit/test_agent_dotnet_vectors.py

      - name: Keep the portable test report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: agent-dotnet-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 1

  # Build and validate the payload for MSI packaging.
  windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/artifacts/dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: agent-dotnet/global.json
      - name: Publish self-contained Windows executable
        working-directory: agent-dotnet
        run: |
          publish=../artifacts/agent-dotnet/publish
          dotnet publish src/Sli.Agent.Service -c Release -r win-x64 --self-contained -o "$publish"
          test -s "$publish/SliAgent.exe"
      - name: Validate artifact input paths (no content inspection)
        id: artifact_inputs
        run: |
          set -euo pipefail
          shopt -s nullglob dotglob
          publish=artifacts/agent-dotnet/publish
          [[ -d "$publish" ]] || { echo "Missing Windows payload" >&2; exit 1; }
          find "$publish" -type f -print0 > "$RUNNER_TEMP/t012-payload-paths"
          mapfile -d '' -t files < "$RUNNER_TEMP/t012-payload-paths"
          (( ${#files[@]} )) || { echo "Empty Windows payload" >&2; exit 1; }
          files+=(
            agent-dotnet/installer/*.wxs
            agent-dotnet/installer/native/*.cpp
            agent-dotnet/installer/native/*.h
            agent-dotnet/tools/Build-Msi.ps1
            agent-dotnet/tools/Build-RegistrationCA.ps1
            agent-dotnet/tools/Test-MsiTables.ps1
            agent-dotnet/tools/Test-RegistrationNative.ps1
            agent-dotnet/tools/Test-RegistrationParity.ps1
            agent-dotnet/tests/native/*.cpp
            agent-dotnet/src/*/*.cs
            agent-dotnet/src/*/*.csproj
            agent-dotnet/src/Sli.Agent.Core/Resources/dc-event-catalog.json
            agent-dotnet/Directory.Build.props
            agent-dotnet/Directory.Packages.props
            agent-dotnet/global.json
            agent-dotnet/NuGet.Config
            agent-dotnet/.config/dotnet-tools.json
          )
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || { echo "Missing artifact input: $file" >&2; exit 1; }
            case "$file" in
              *"*"*|*"?"*|*"["*|*"]"*|*"{"*|*"}"*|*"!"*|*$'\n'*|*$'\r'*)
                echo "Artifact inputs must be literal single-line paths" >&2; exit 1 ;;
            esac
            if [[ "$file" != agent-dotnet/.config/dotnet-tools.json ]]; then
              case "/$file" in */.*) echo "Unexpected hidden artifact input: $file" >&2; exit 1 ;; esac
            fi
          done
          {
            printf 'paths<<T012_ARTIFACT_PATHS\n'
            printf '%s\n' "${files[@]}"
            printf 'T012_ARTIFACT_PATHS\n'
          } >> "$GITHUB_OUTPUT"
          printf 'Validated %s artifact input paths\n' "${#files[@]}"
      - name: Keep Windows payload and MSI source for the local Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: agent-dotnet-win-x64
          # Free-plan storage: a fresh copy is produced by every run.
          retention-days: 3
          # Only the exact hidden tool manifest may pass the inventory guard.
          include-hidden-files: true
          # Installed/restored Windows/.NET/WiX tooling remains external.
          # Parity additionally needs an external RegistrationFile oracle assembly.
          path: ${{ steps.artifact_inputs.outputs.paths }}
