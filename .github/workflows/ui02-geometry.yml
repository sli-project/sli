name: UI02 manual geometry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui02-geometry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry:
    runs-on: ${{ vars.SLI_LINUX_RUNNER || 'ubuntu-latest' }}
    env:
      ADLOG_DB_BACKEND: postgres
      ADLOG_PG_DSN: postgresql://sli-pytest.invalid:5432/sli_pytest_unreachable
      ADLOG_DISABLE_SCHEDULER: '1'
      ADLOG_DISABLE_COLLECTION: '1'
      ADLOG_AI_EXECUTE_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npx playwright install chromium
      - name: Inventory literals and control candidates
        run: node frontend/tests/ui02-audit.mjs > ui02-audit.json
      - name: Check UI02 geometry with synthetic API responses
        run: npx playwright test --config frontend/tests/geometry.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui02-geometry
          path: |
            artifacts/ui02/
            ui02-audit.json
          retention-days: 14
