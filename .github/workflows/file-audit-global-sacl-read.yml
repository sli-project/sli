name: Read Windows global file SACL
on:
  push:
    branches: ['codex/file-audit-debian-kit-23e9547d']
    paths:
      - '.github/workflows/file-audit-global-sacl-read.yml'
      - 'scripts/ci/file-audit-global-sacl-read.ps1'
      - 'scripts/ci/file-audit-global-sacl-read.cs'
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: agent-dotnet/global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-dotnet-win-x64
          path: ${{ runner.temp }}/sli-audit-read-input
          run-id: '45531914411'
          github-token: ${{ github.token }}
      - name: Read Security and global file SACL as the standard service account
        shell: pwsh
        run: ./scripts/ci/file-audit-global-sacl-read.ps1
      - name: Attach the bounded Windows audit results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: file-audit-global-sacl-read-23e9547d
          path: ${{ runner.temp }}/sli-audit-read-evidence.json
          if-no-files-found: ignore
          retention-days: 7
