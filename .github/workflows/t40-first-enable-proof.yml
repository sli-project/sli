name: T40 first workstation enable regression

on:
  push:
    branches: ['test/t40-workstation-first-enable-proof']

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ vars.SLI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      BASE: 0d50f8a4613c32cd65b52564c6fc81548a555c52
      TZ: UTC
      DOTNET_NOLOGO: "1"
      DOTNET_gcServer: "0"
    defaults:
      run:
        shell: bash
        working-directory: server-dotnet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: server-dotnet/global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Locate writers of the core server inventory
        working-directory: .
        run: |
          mkdir -p "$RUNNER_TEMP/t40-first-enable"
          git grep -nEi '\b(insert[[:space:]]+into|update|copy|merge[[:space:]]+into)[[:space:]]+(public\.)?"?servers\b' "$BASE" -- \
            server-dotnet/src server/sli server/api deploy scripts config >"$RUNNER_TEMP/t40-first-enable/inventory-writers.txt"
          awk 'length($0)<=700' "$RUNNER_TEMP/t40-first-enable/inventory-writers.txt" | head -100
      - name: PostgreSQL 18 for tests on the real schema
        # The baseline uses settings newer than the image's default server.
        run: |
          # The project's own runner image ships PostgreSQL 18 and has no sudo.
          if [ -x /usr/lib/postgresql/18/bin/initdb ]; then exit 0; fi
          sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          # Do not create a system cluster; this job owns only its temporary cluster.
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18
      - name: Confirm the regression fails before the fix and passes after it
        working-directory: .
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/t40-first-enable"
          paths=(server-dotnet/src/Sli.Server/Agents/Registry/AgentEnrollmentService.cs
            server-dotnet/src/Sli.Server/Agents/Control/AgentModuleAssignmentService.cs
            frontend/src/app/admin/agents.tsx)
          npm ci --no-audit --no-fund
          npm --prefix frontend ci --no-audit --no-fund
          dotnet_check() {
            local stage=$1
            (
              cd server-dotnet
              dotnet build tests/Sli.Server.Tests/Sli.Server.Tests.csproj -c Release --no-restore --disable-build-servers
              dotnet tests/Sli.Server.Tests/bin/Release/net10.0/Sli.Server.Tests.dll \
                -class Sli.Server.Tests.Agents.WorkstationEnrollmentAssignmentPostgresTests \
                -failSkips -noColor -noAutoReporters -reporter verbose -result-xml "$result/server-$stage.xml"
            )
          }
          (
            cd server-dotnet
            dotnet restore tests/Sli.Server.Tests/Sli.Server.Tests.csproj --locked-mode --disable-build-servers
          )
          git restore --source="$BASE" -- "${paths[@]}"
          if dotnet_check red >"$result/server-red.log" 2>&1; then
            cat "$result/server-red.log"
            exit 1
          fi
          cat "$result/server-red.log"
          test -s "$result/server-red.xml"
          git grep -q 'workstation_journal_profile_unsupported' "$BASE" -- server-dotnet/src/Sli.Server/Agents/Control/AgentModuleAssignmentService.cs
          grep -F 'workstation_journal_profile_unsupported' "$result/server-red.log"
          if npm --prefix frontend run test -- src/app/admin/agents.test.tsx -t 'shows the allowed workstation event IDs' >"$result/ui-red.log" 2>&1; then
            cat "$result/ui-red.log"
            exit 1
          fi
          cat "$result/ui-red.log"
          grep -F 'AssertionError' "$result/ui-red.log"
          git restore --source=HEAD -- "${paths[@]}"
          dotnet_check green 2>&1 | tee "$result/server-green.log"
          npm --prefix frontend run test -- src/app/admin/agents.test.tsx 2>&1 | tee "$result/ui-green.log"
      - name: Preserve the regression and inventory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t40-first-enable-regression
          path: ${{ runner.temp }}/t40-first-enable/
          if-no-files-found: warn
          retention-days: 7
