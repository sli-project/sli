name: Standalone n03 full-kit rehearsal

on:
  push:
    branches:
      - beta1/n03-full-kit-rehearsal-local

permissions:
  contents: read

jobs:
  agent-msi:
    if: github.repository == 'sli-project/sli'
    uses: ./.github/workflows/agent-msi.yml
    with:
      commit: ${{ github.sha }}
      n03_kit_rehearsal: true

  build-rehearsal:
    needs: agent-msi
    if: github.repository == 'sli-project/sli'
    runs-on: ubuntu-latest
    container: debian@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - name: Bootstrap trusted builder tools
        shell: bash
        run: |
          set -euo pipefail
          [[ -f /.dockerenv && $GITHUB_ACTIONS == true ]]
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-remove \
            -o APT::Get::allow-downgrades=false ca-certificates curl git python3
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact source and installer contract
        shell: bash
        run: |
          set -euo pipefail
          git_safe=(git -c "safe.directory=$GITHUB_WORKSPACE")
          [[ $GITHUB_SHA =~ ^[a-f0-9]{40}$ && $("${git_safe[@]}" rev-parse HEAD) == "$GITHUB_SHA" ]]
          "${git_safe[@]}" merge-base --is-ancestor 8a0f468833c5b0b77b603e87c9bd67e0ef7371f6 "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: /opt/dotnet
        with:
          global-json-file: server-dotnet/global.json
      - name: Download the exact predecessor kit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: '14824973514'
          run-id: '45190713233'
          repository: sli-project/sli
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/n03-predecessor
      - name: Download this workflow's candidate agent MSI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sli-agent-dotnet-msi-${{ github.sha }}
          path: ${{ runner.temp }}/n03-candidate-agent
      - name: Build and verify the private full kit
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/proofs/n03-apt/build-full-kit-rehearsal.sh
