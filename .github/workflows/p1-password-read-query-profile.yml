name: P1 PostgreSQL read query profile

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  measurement:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'p1/profile-password-read-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: UTC
      SLI_TEST_P1_PHASES_411: '1'
      SLI_TEST_P1_SPRAY_HISTORY_411: '1'
      DOTNET_gcServer: '0'
      DOTNET_GCHeapHardLimit: '40000000'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: server-dotnet/global.json
      - name: PostgreSQL 18 for the disposable cluster
        run: |
          if [ -x /usr/lib/postgresql/18/bin/initdb ]; then exit 0; fi
          sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18
      - name: Profile the retained Spray chain on current PostgreSQL schema
        working-directory: server-dotnet
        run: |
          test -f /usr/lib/postgresql/18/lib/auto_explain.so
          project=tests/Sli.Server.Tests/Sli.Server.Tests.csproj
          dotnet restore "$project" --locked-mode --disable-build-servers
          dotnet run --project "$project" --configuration Release --no-restore -- \
            -method 'Sli.Server.Tests.Semantic.PasswordThroughputPostgresTests.Both_password_rules_drain_one_hour_of_dc_events_and_keep_live_coverage_current' \
            -showLiveOutput -failSkips -noColor -result-xml "$RUNNER_TEMP/p1-password-read-profile.xml"
          python3 - "$RUNNER_TEMP/p1-password-read-profile.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse(sys.argv[1]).iter("test"))
          assert len(cases) == 1 and cases[0].get("result") == "Pass"
          assert cases[0].get("method") == "Both_password_rules_drain_one_hour_of_dc_events_and_keep_live_coverage_current"
          PY
      - name: Retain the isolated measurement report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p1-password-read-profile
          path: ${{ runner.temp }}/p1-password-read-profile.xml
          if-no-files-found: ignore
          retention-days: 7
