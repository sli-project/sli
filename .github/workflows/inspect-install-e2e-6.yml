name: Isolate Debian systemd credential delivery

on:
  push:
    branches: [codex/install-e2e-first-start]
    paths: [.github/workflows/inspect-install-e2e-6.yml]

permissions:
  contents: read

jobs:
  credentials:
    if: github.repository == 'sli-project/sli'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare unit credential delivery with and without the privileged pre-start
        shell: bash
        run: |
          set -euo pipefail
          docker build -t sli-credential-fixture - <<'DOCKERFILE'
          FROM debian:trixie@sha256:3cda3ca472ce45507a5109c6a3907093e24d9ae67d55954c9a07a45665dafba2
          RUN apt-get update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                systemd systemd-sysv dbus sudo curl ca-certificates iproute2 python3-minimal && \
              rm -f /usr/sbin/policy-rc.d && rm -rf /var/lib/apt/lists/*
          DOCKERFILE

          docker run --detach --name sli-credential-fixture --hostname sli-e2e \
            --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock --shm-size=1g \
            sli-credential-fixture /bin/sh -ec 'mount --make-shared /run; exec /usr/bin/setpriv --bounding-set=-sys_module --inh-caps=-sys_module -- /sbin/init'
          until docker exec sli-credential-fixture systemctl show --property=Version --value; do
            [[ $(docker inspect --format '{{.State.Running}}' sli-credential-fixture) == true ]]
            sleep 1
          done
          docker exec sli-credential-fixture systemctl is-system-running --wait
          docker exec sli-credential-fixture awk '$5 == "/run" && $7 ~ /^shared:/ { print "container_run_propagation=shared"; ok=1 } END { exit !ok }' /proc/1/mountinfo

          docker exec -i sli-credential-fixture bash -s <<'FIXTURE'
          set -euo pipefail
          groupadd --system postgres
          useradd --system --gid postgres --no-create-home --shell /usr/sbin/nologin postgres
          install -d -m 0750 /etc/sli/secrets
          for name in postgres_password migration_password runtime_password; do
            install -m 0640 /dev/null "/etc/sli/secrets/$name"
            printf 'synthetic\n' > "/etc/sli/secrets/$name"
          done
          install -d -m 0755 /usr/local/libexec
          cat > /usr/local/libexec/sli-credential-check.py <<'PY'
          import errno
          import os
          import sys
          from pathlib import Path

          directory = Path(os.environ.get('CREDENTIALS_DIRECTORY', '/'))
          print(f'credential_env_expected={directory == Path("/run/credentials", sys.argv[1])}')
          print(f'credential_directory_present={directory.is_dir()}')
          status = 0
          for name in ('postgres_password', 'migration_password', 'runtime_password'):
              try:
                  fd = os.open(directory / name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              except OSError as error:
                  print(f'{name}: {errno.errorcode.get(error.errno, "unknown")}')
                  status = 1
              else:
                  metadata = os.fstat(fd)
                  mode = metadata.st_mode & 0o777
                  private = metadata.st_uid == os.geteuid() and mode in (0o400, 0o600)
                  delivered = metadata.st_uid == 0 and metadata.st_gid == 0 and mode == 0o440 and os.statvfs(directory).f_flag & os.ST_RDONLY
                  os.close(fd)
                  if private or delivered:
                      print(f'{name}: open-ok')
                  else:
                      print(f'{name}: invalid-delivery-mode')
                      status = 1
          sys.exit(status)
          PY
          for variant in with-pre without-pre; do
            unit="sli-credential-$variant.service"
            {
              printf '%s\n' '[Service]' 'Type=oneshot' 'User=postgres' 'Group=postgres'
              if [[ $variant == with-pre ]]; then
                printf '%s\n' 'ExecStartPre=+/usr/bin/true'
              fi
              for name in postgres_password migration_password runtime_password; do
                printf 'LoadCredential=%s:/etc/sli/secrets/%s\n' "$name" "$name"
              done
              printf 'ExecStart=/usr/bin/python3 -B /usr/local/libexec/sli-credential-check.py %s\n' "$unit"
              printf '%s\n' 'NoNewPrivileges=yes' 'PrivateTmp=yes' 'InaccessiblePaths=-/run/docker.sock -/var/run/docker.sock'
            } > "/run/systemd/system/$unit"
          done
          systemctl daemon-reload
          for variant in with-pre without-pre; do
            unit="sli-credential-$variant.service"
            code=0
            systemctl start "$unit" >/dev/null 2>&1 || code=$?
            printf '%s: start_exit=%s\n' "$unit" "$code"
            systemctl show "$unit" --property=Result,ExecMainStatus
            journalctl -u "$unit" -o cat --no-pager |
              grep -E '^(credential_env_expected|credential_directory_present)=(True|False)$|^(postgres_password|migration_password|runtime_password): (open-ok|invalid-delivery-mode|[A-Z0-9_]+)$' || true
            test "$code" -eq 0
          done
          FIXTURE
      - name: Remove the synthetic container
        if: always()
        shell: bash
        run: |
          if docker inspect sli-credential-fixture >/dev/null 2>&1; then
            docker rm --force sli-credential-fixture
          fi
