name: Validate the fixed install fixture on archived kits

on:
  push:
    branches: [codex/install-e2e-first-start]
    paths: [.github/workflows/inspect-install-e2e-6.yml]

permissions:
  actions: read
  contents: read

jobs:
  install:
    if: github.repository == 'sli-project/sli'
    name: Archived scenario ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        scenario: [B, C]
    env:
      SCENARIO: ${{ matrix.scenario }}
      BASE_COMMIT: 0f6093b3a9afcecb28fcdd47c7ed50522e50a156
      CANDIDATE_COMMIT: 1c25b9f1661ac2412bfc584f3fcbffda1ea95229
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.scenario == 'B'
        with:
          github-token: ${{ github.token }}
          run-id: '45510515483'
          name: sli-debian-beta-kit-${{ env.BASE_COMMIT }}
          path: ${{ runner.temp }}/sli-kits/base
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: '45510515483'
          name: sli-debian-beta-kit-${{ env.CANDIDATE_COMMIT }}
          path: ${{ runner.temp }}/sli-kits/candidate
      - name: Execute the verified production unpack and boot steps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/install-e2e.yml').read_text().splitlines()
          target = Path(os.environ['RUNNER_TEMP'])
          for label, filename in (
              ('Verify and unpack the kits', 'unpack-validated.sh'),
              ('Boot clean Debian 13 with systemd', 'boot-validated.sh'),
          ):
              step = source.index(f'      - name: {label}')
              body = source.index('        run: |', step) + 1
              end = next(i for i in range(body, len(source)) if source[i].startswith('      - name: '))
              (target / filename).write_text(dedent('\n'.join(source[body:end])) + '\n')
          PY
          bash "$RUNNER_TEMP/unpack-validated.sh"
          bash "$RUNNER_TEMP/boot-validated.sh"
          docker inspect sli-install-e2e | jq -e '
            .[0] | {run_tmpfs:(.HostConfig.Tmpfs|has("/run")),
              bind_mounts:[.Mounts[]|select(.Type=="bind")|
                {destination:.Destination, propagation:.Propagation, writable:.RW}]}
            | select(.run_tmpfs and (.bind_mounts|length==3) and all(.bind_mounts[]; .propagation=="rprivate"))'
          docker exec sli-install-e2e findmnt --mountpoint /run -n -o TARGET,FSTYPE,PROPAGATION
          getty=$(docker exec sli-install-e2e systemctl is-enabled getty@tty1.service || true)
          [[ $getty == masked ]]
          printf '%s\n' 'Container-only getty@tty1.service is masked.'
      - name: Run the original scenario and retain only safe markers
        shell: bash
        run: |
          set -euo pipefail
          code=0
          log="$RUNNER_TEMP/scenario-private.log"
          docker exec sli-install-e2e bash -x /install-e2e.sh "$SCENARIO" >"$log" 2>&1 || code=$?
          printf 'Scenario %s exit=%s\n' "$SCENARIO" "$code"
          grep -E '^(SLI ready on beta1-[a-f0-9]+ [a-zA-Z0-9.+~:-]+|PostgreSQL migration [0-9]+ applied|Upgrade preserved two synthetic PostgreSQL receipts \(SHA-256 verified\))$' "$log" || true
          if [[ $code -ne 0 ]]; then
            docker exec sli-install-e2e systemctl show sli-postgresql.service sli-bootstrap-pg.service sli-ready.service \
              --property=Id,LoadState,ActiveState,Result,ExecMainStatus --no-pager || true
            docker exec sli-install-e2e journalctl -b -t sli-setup -o cat --no-pager |
              grep -oE '\bnative_[a-z0-9_]+\b' | sort -u || true
            grep -E '^SLI could not finish its first start\.' "$log" || true
            python3 - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace').splitlines()
          phases = re.compile(r'^\+\s+(install_kit|check_installation|seed_upgrade_receipts|receipt_snapshot|check_migration|postgres_query|fail)\b')
          tokens = re.compile(r'\b(?:native_[a-z0-9_]{3,100}|sli[-a-z0-9@_.]+\.(?:service|target|mount|timer|path))\b')
          for number, line in enumerate(lines, 1):
              m = phases.match(line)
              if m:
                  labels = re.findall(r'/kits/(base|candidate)/', line)
                  print(f'phase trace at {number}: {m[1]} {" ".join(labels)}'.rstrip())
              elif line.startswith('+ python3 -I /kits/candidate/sli-debian-beta-kit/remove-beta-kit --purge-data'):
                  print(f'phase trace at {number}: remove-beta-kit')
              elif not line.startswith('+'):
                  found = set(tokens.findall(line))
                  for needle, tag in (
                      ('Failed systemd units:', 'failed_units'),
                      ('SLI removal failed:', 'remove_failed'),
                      ('Unexpected mount in SLI data directory', 'unexpected_mount'),
                      ('is still running:', 'unit_still_running'),
                      ('still has processes:', 'unit_processes'),
                      ('SLI database volume does not match', 'volume_mismatch'),
                      ('SLI database directory is unavailable', 'database_directory_unavailable'),
                      ('Unsafe SLI data directory:', 'unsafe_purge_directory'),
                      ('E: ', 'apt_error'),
                      ('psql:', 'psql_error'),
                      ('Permission denied', 'permission_denied'),
                      ('not enough', 'insufficient_resources'),
                      ('Read-only file system', 'read_only_filesystem'),
                  ):
                      if needle in line:
                          found.add(tag)
                  if found:
                      print(f'failure markers at {number}: {", ".join(sorted(found))}')
          PY
            docker exec sli-install-e2e systemctl list-units --failed --plain --no-legend --no-pager |
              awk '$1 ~ /^[A-Za-z0-9_.@-]+\.(service|target|mount|socket|path|timer)$/ && $3 == "failed" { print "Failed unit: " $1 }' || true
          fi
          exit "$code"
      - name: Remove the discarded machine and volume
        if: always()
        shell: bash
        run: |
          if docker inspect sli-install-e2e >/dev/null 2>&1; then
            docker rm --force sli-install-e2e
          fi
          if mountpoint -q "$RUNNER_TEMP/sli-disk"; then
            sudo umount "$RUNNER_TEMP/sli-disk"
          fi
