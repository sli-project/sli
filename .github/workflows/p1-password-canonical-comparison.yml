name: P1 password canonicalization comparison

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  actions: read

jobs:
  measurement:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/p1-password-portion-canonical-415-ab-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: UTC
      SLI_TEST_P1_PHASES_411: '1'
      SLI_TEST_P1_COMPARE_CANONICAL: '1'
      SLI_TEST_P1_SPRAY_HISTORY_411: '1'
      DOTNET_gcServer: '0'
      DOTNET_GCHeapHardLimit: '40000000'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: server-dotnet/global.json
      - name: PostgreSQL 18 for the disposable cluster
        run: |
          if [ -x /usr/lib/postgresql/18/bin/initdb ]; then exit 0; fi
          sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18
      - name: Locate the standard Linux build of this exact head
        id: exact_build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P1_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 32); do
            run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/server-dotnet.yml/runs" \
              -f event=pull_request -f head_sha="$P1_HEAD_SHA" --jq '.workflow_runs[0].id // empty')
            if [ -n "$run_id" ]; then
              artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '.artifacts[] | select(.name=="server-dotnet-linux-build" and .expired==false) | .id')
              if [ -n "$artifact_id" ]; then
                printf '%s\n' "run_id=$run_id" "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
          done
          echo 'The exact Server .NET build artifact did not become available.' >&2
          exit 1
      - name: Download the exact Linux test build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.exact_build.outputs.artifact_id }}
          path: ${{ runner.temp }}/server-dotnet-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.exact_build.outputs.run_id }}
      - name: Compare both decoders on one prepared Spray state
        working-directory: server-dotnet
        run: |
          test -f /usr/lib/postgresql/18/lib/auto_explain.so
          bundle="$RUNNER_TEMP/server-dotnet-build/server-dotnet-linux-build"
          diff -u "$bundle/source-directory" <(pwd -P)
          tar -xf "$bundle/test-binaries.tar"
          assembly=$(find tests/Sli.Server.Tests/bin/Release -type f -name Sli.Server.Tests.dll -print -quit)
          test -n "$assembly"
          grep -aq CompareRetainedReadOnClonesAsync "$assembly"
          dotnet "$assembly" \
            -method 'Sli.Server.Tests.Semantic.PasswordThroughputPostgresTests.Both_password_rules_drain_one_hour_of_dc_events_and_keep_live_coverage_current' \
            -showLiveOutput -failSkips -noColor -result-xml "$RUNNER_TEMP/p1-password-canonical-comparison.xml"
          python3 - "$RUNNER_TEMP/p1-password-canonical-comparison.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse(sys.argv[1]).iter("test"))
          assert len(cases) == 1 and cases[0].get("result") == "Pass"
          assert cases[0].get("method") == "Both_password_rules_drain_one_hour_of_dc_events_and_keep_live_coverage_current"
          PY
      - name: Retain the isolated measurement report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p1-password-canonical-comparison
          path: ${{ runner.temp }}/p1-password-canonical-comparison.xml
          if-no-files-found: ignore
          retention-days: 7
