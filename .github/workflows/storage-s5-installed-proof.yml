name: Installed storage S5 proof

on:
  push:
    branches: ['test/storage-s5-installed-63d35eb8']
    paths:
      - '.github/workflows/storage-s5-installed-proof.yml'
      - 'scripts/ci/storage-s5-installed-guest.sh'
      - 'scripts/ci/storage-s5-installed-fixture.cs'

permissions:
  contents: read
  actions: read

jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      KIT_COMMIT: 63d35eb8df2912ae1c27a93ed478f81575a3ae2a
      KIT_RUN: '45522104583'
      HARNESS_COMMIT: 1c9498a16fe6f27f32596991c3bb4d0448c6e650
      HARNESS_BLOB: 5e7818aad9a7e21335c50a199cfa89b471254ad0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 8
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: server-dotnet/global.json
      - name: Build only the fixture against the pinned server source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = sli-project/sli
          bash -n scripts/ci/storage-s5-installed-guest.sh
          test "$(git diff --name-only "$KIT_COMMIT" HEAD -- server-dotnet config deploy)" = ""
          cp scripts/ci/storage-s5-installed-fixture.cs server-dotnet/tests/Sli.Server.Tests/Storage/InstalledStorageS5Fixture.cs
          cd server-dotnet
          project=tests/Sli.Server.Tests/Sli.Server.Tests.csproj
          dotnet restore "$project" --locked-mode --disable-build-servers
          dotnet build "$project" -c Release --no-restore --disable-build-servers -o "$RUNNER_TEMP/sigma-tests"
          runtime="$RUNNER_TEMP/sigma-dotnet"
          mkdir -p "$runtime/shared"
          fsroot=$(dirname "$(readlink -f "$(command -v dotnet)")")
          cp "$fsroot/dotnet" "$runtime/"
          cp -a "$fsroot/host" "$fsroot/shared/Microsoft.NETCore.App" "$fsroot/shared/Microsoft.AspNetCore.App" "$runtime/"
          mv "$runtime/Microsoft.NETCore.App" "$runtime/Microsoft.AspNetCore.App" "$runtime/shared/"
      - name: Retrieve the exact Debian TAR from the standard build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="repos/$GITHUB_REPOSITORY/actions"
          artifact_name="sli-debian-beta-kit-$KIT_COMMIT"
          record=
          for attempt in $(seq 1 45); do
            run=$(gh api "$base/runs/$KIT_RUN")
            jq -e --arg sha "$KIT_COMMIT" \
                '.head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch"' \
                >/dev/null <<<"$run"
            if jq -e '.status == "completed" and .conclusion != "success"' >/dev/null <<<"$run"; then
              jq -c '{status, conclusion, html_url}' <<<"$run" >&2
              exit 1
            fi
            metadata=$(gh api "$base/runs/$KIT_RUN/artifacts?per_page=100")
            record=$(jq -c --arg name "$artifact_name" \
              '.artifacts[] | select(.name == $name and .expired == false and (.digest // "" | test("^sha256:[a-f0-9]{64}$")))' <<<"$metadata")
            [[ -z "$record" ]] || break
            sleep 30
          done
          [[ -n "$record" ]]
          artifact=$(jq -er .id <<<"$record")
          digest=$(jq -er '.digest | sub("^sha256:";"")' <<<"$record")
          kit="$RUNNER_TEMP/sigma-kit"
          evidence="$RUNNER_TEMP/p1-rollback-evidence"
          mkdir -p "$kit" "$evidence"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 2 --max-time 240 -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/$base/artifacts/$artifact/zip" -o "$kit/artifact.zip"
          printf '%s  %s\n' "$digest" "$kit/artifact.zip" | sha256sum --check --strict
          unzip -p "$kit/artifact.zip" sli-debian-beta-kit.tar.gz >"$kit/sli-debian-beta-kit.tar.gz"
          unzip -p "$kit/artifact.zip" SHA256SUMS >"$kit/SHA256SUMS"
          (cd "$kit"; sha256sum sli-debian-beta-kit.tar.gz | cmp - SHA256SUMS)
          printf '%s  %s\n' "$KIT_TAR_SHA256" "$kit/sli-debian-beta-kit.tar.gz" | sha256sum --check --strict
          rm -- "$kit/artifact.zip"
          printf 'kit_run=%s artifact=%s git=%s zip_sha256=%s\n' \
            "$KIT_RUN" "$artifact" "$KIT_COMMIT" "$digest" | tee "$evidence/artifacts.txt"
      - name: Reuse the pinned Debian QEMU runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/contents/scripts/ci/p1-native-rollback-vm.sh?ref=$HARNESS_COMMIT" \
            --jq .content | base64 -d >"$RUNNER_TEMP/pinned-vm.sh"
          test "$(git hash-object "$RUNNER_TEMP/pinned-vm.sh")" = "$HARNESS_BLOB"
          python3 - "$RUNNER_TEMP/pinned-vm.sh" "$RUNNER_TEMP/sigma-vm.sh" <<'PY'
          import sys
          from pathlib import Path

          source, dest = map(Path, sys.argv[1:])
          driver = source.read_text()
          guest_begin = "    stage=install_410\n"
          runner_begin = '[[ $# == 4 && $1 == runner ]]\n'
          assert driver.count(guest_begin) == driver.count(runner_begin) == 1
          guest, tail = driver.split(guest_begin)
          _, runner = tail.split(runner_begin)

          for line in (
              "old_dir=$2",
              "old_commit=0f6093b3a9afcecb28fcdd47c7ed50522e50a156",
              "old_hash=38115eee4fe10dbf5a422d13ccbb644ff5c0837cb371cb397579c0fb56b0338e",
              'verify_archive "$old_dir" "$old_commit"',
              "printf '%s  %s\\n' \"$old_hash\" \"$old_dir/sli-debian-beta-kit.tar.gz\" | sha256sum --check --strict",
              'cp --reflink=auto "$old_dir/sli-debian-beta-kit.tar.gz" input/predecessor.tar.gz',
              'cp "$GITHUB_WORKSPACE/scripts/ci/p1-native-410-411-rollback.sh" input/',
          ):
              assert runner.count(line + "\n") == 1
              runner = runner.replace(line + "\n", "")

          replacements = {
              "new_dir=$3\nnew_commit=$4": "new_dir=$2\nnew_commit=$3",
              """printf 'base=%s\\ncandidate=%s\\n' "$old_commit" "$new_commit" """:
                  """printf 'candidate=%s\\n' "$new_commit" """,
              """printf 'base_tar_sha256=%s\\ncandidate_tar_sha256=%s\\n' "$old_hash" "$new_hash" """:
                  """printf 'candidate_tar_sha256=%s\\n' "$new_hash" """,
              'cp "$GITHUB_WORKSPACE/scripts/ci/p1-native-rollback-vm.sh" input/':
                  'cp "$0" input/p1-native-rollback-vm.sh\n'
                  'cp "$GITHUB_WORKSPACE/scripts/ci/storage-s5-installed-guest.sh" input/\n'
                  'cp -R "$RUNNER_TEMP/sigma-dotnet" "$RUNNER_TEMP/sigma-tests" input/',
          }
          for before, after in replacements.items():
              assert runner.count(before) == 1
              runner = runner.replace(before, after)

          dest.write_text(guest + """
              stage=storage_s5_installed
              bash "$input/storage-s5-installed-guest.sh" "$database_uuid" "$backup_root" "$initial_log" "$initial_trace"
              stage=verified
              exit 0
          fi

          [[ $# == 3 && $1 == runner ]]
          """ + runner)
          PY
          bash -n "$RUNNER_TEMP/sigma-vm.sh"
          bash -n scripts/ci/storage-s5-installed-guest.sh
          bash "$RUNNER_TEMP/sigma-vm.sh" runner "$RUNNER_TEMP/sigma-kit" "$KIT_COMMIT"
      - name: Attach aggregate installed S5 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storage-s5-installed-63d35eb8
          path: ${{ runner.temp }}/p1-rollback-evidence/
          if-no-files-found: ignore
          retention-days: 7
