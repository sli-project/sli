name: Pull Request gate

on:
  pull_request:
  push:
    branches: [main]
  # Main must require `source` through the merge queue. Set build concurrency
  # and maximum group size to 1 so each PR checks against its actual predecessor.
  # The queue requests fresh checks as it advances the base.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      postgres: ${{ steps.diff.outputs.postgres }}
      unit: ${{ steps.diff.outputs.unit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - name: Require new migrations to follow the current base
        id: migration-order
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          git fetch --no-tags origin "refs/heads/${BASE_REF#refs/heads/}"
          python3 -m scripts.ci.pr_migration_order "$BASE" "$HEAD" FETCH_HEAD
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = push ]; then
            printf '%s\n' frontend=true postgres=false unit=false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          diff=()
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            diff=(--diff "$BASE" "$HEAD")
          fi
          python3 -m scripts.ci.pr_scope "${diff[@]}" --github-output "$GITHUB_OUTPUT"

  source:
    name: Source checks
    needs: changes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # Fetch setup actions over git: codeload archives time out during job setup.
      # Keep the same action revision and use the ignored artifacts directory.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: actions/setup-python
          ref: a26af69be951a213d495a4c3e4e4022e16d87065
          path: artifacts/ci-actions/setup-python
          persist-credentials: false
      - uses: ./artifacts/ci-actions/setup-python
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pip install --disable-pip-version-check ruff==0.16.9
      - run: python -m ruff check --config .github/ruff-ci.toml scripts tests
      - run: python scripts/maintenance/github_sanitary_check.py --root . --json
      - run: python -m compileall -q scripts tests
      - run: python -m ruff check --config .github/ruff-ci.toml deploy/linux/sli_secrets.py tests/unit/test_sli_secrets.py
      - name: Select Python tests
        if: needs.changes.outputs.unit == 'true'
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          diff=()
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            diff=(--diff "$BASE" "$HEAD")
          fi
          python -m scripts.ci.pr_scope "${diff[@]}" --argfiles "$RUNNER_TEMP/sli-pr-tests"
      - name: Domain binding, native secrets and package verification
        if: needs.changes.outputs.unit == 'true'
        shell: bash
        run: |
          args="$RUNNER_TEMP/sli-pr-tests/source.txt"
          test -f "$args"
          if [ -s "$args" ]; then
            python -m pytest -q -m "not legacy" "@$args"
          fi
      - name: Verify installer checkpoint cleanup and recovery
        if: needs.changes.outputs.unit == 'true'
        shell: bash
        run: |
          args="$RUNNER_TEMP/sli-pr-tests/checkpoint.txt"
          test -f "$args"
          if [ ! -s "$args" ]; then
            exit 0
          fi
          report=$(mktemp "$RUNNER_TEMP/sli-checkpoint-cleanup.XXXXXX")
          python -B -m pytest -q --junitxml="$report" "@$args"
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse(sys.argv[1]).iter('testcase'))
          if not cases or any(case.find('skipped') is not None for case in cases):
              raise SystemExit('Installer checkpoint tests must run without skips')
          PY
      - name: Verify native Linux unit contracts
        if: needs.changes.outputs.unit == 'true'
        shell: bash
        env:
          ADLOG_DISABLE_SCHEDULER: "1"
          ADLOG_DISABLE_COLLECTION: "1"
          ADLOG_CONTINUOUS_RECOVERY: "false"
          ADLOG_AI_EXECUTE_ENABLED: "false"
          ADLOG_DB_BACKEND: postgres
          ADLOG_PG_DSN: "postgresql://sli-pytest.invalid:5432/sli_pytest_unreachable"
        run: |
          args="$RUNNER_TEMP/sli-pr-tests/posix.txt"
          test -f "$args"
          if [ -s "$args" ]; then
            python -m pytest -q -m "posix_only and not postgres_integration and not host_dependent and not legacy" "@$args"
          fi

  gate:
    # Preserve the required status check name while the source checks run independently.
    name: source
    needs: [changes, source, tests, frontend, postgres, native-package-upgrade]
    if: ${{ always() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require source checks and applicable suites
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          UNIT_REQUIRED: ${{ needs.changes.outputs.unit }}
          UNIT_RESULT: ${{ needs.tests.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          POSTGRES_REQUIRED: ${{ needs.changes.outputs.postgres }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
          NATIVE_PACKAGE_UPGRADE_RESULT: ${{ needs.native-package-upgrade.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$SOURCE_RESULT" = success
          require_suite() {
            if [ "$1" = true ]; then
              test "$2" = success
            else
              test "$1" = false && test "$2" = skipped
            fi
          }
          require_suite "$UNIT_REQUIRED" "$UNIT_RESULT"
          require_suite "$FRONTEND_REQUIRED" "$FRONTEND_RESULT"
          require_suite "$POSTGRES_REQUIRED" "$POSTGRES_RESULT"
          require_suite "$POSTGRES_REQUIRED" "$NATIVE_PACKAGE_UPGRADE_RESULT"

  tests:
    # Shipped Python unit/contracts: live-PostgreSQL tests are
    # marked postgres_integration and run in the disposable postgres job;
    # host_dependent tests need operator-host software (RSAT) or idle capacity.
    # Native POSIX contracts run on Linux in the required source job.
    needs: changes
    if: ${{ needs.changes.outputs.unit == 'true' }}
    runs-on: ubuntu-latest
    env:
      ADLOG_DISABLE_SCHEDULER: "1"
      ADLOG_DISABLE_COLLECTION: "1"
      ADLOG_CONTINUOUS_RECOVERY: "false"
      ADLOG_AI_EXECUTE_ENABLED: "false"
      ADLOG_DB_BACKEND: "postgres"
      ADLOG_PG_DSN: "postgresql://sli-pytest.invalid:5432/sli_pytest_unreachable"
      # Windows consoles may use cp1252; CLIs print Russian text.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Source-evidence tests read historical commits.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      # Some tooling tests call node (acceptance resume fingerprints).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Unit and contract tests
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          diff=()
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            diff=(--diff "$BASE" "$HEAD")
          fi
          args="$RUNNER_TEMP/sli-pr-tests"
          python -m scripts.ci.pr_scope "${diff[@]}" --argfiles "$args"
          test -f "$args/unit.txt"
          if [ -s "$args/unit.txt" ]; then
            python -m pytest -q -m "not postgres_integration and not host_dependent and not legacy and not posix_only" "@$args/unit.txt"
          fi

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Install dependencies directly to avoid remote cache restore timeouts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: actions/setup-node
          ref: 49933ea5288caeca8642d1e84afbd3f7d6820020
          path: artifacts/ci-actions/setup-node
          persist-credentials: false
      - uses: ./artifacts/ci-actions/setup-node
        with:
          node-version: "22"
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend exec vitest run src
      - run: npm --prefix frontend run build

  native-package-upgrade:
    name: Native package PostgreSQL upgrade
    needs: changes
    if: ${{ needs.changes.outputs.postgres == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Last installed beta before migration 421.
          ref: 9d3e90dae34fdecdb9d28eba082cb5a30107fa92
          path: .net-local/native-upgrade-420
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Installed beta whose ledger ends at migration 442.
          ref: d1475f7d497eb818308faf1a5ef4184d7e7ba78e
          path: .net-local/native-upgrade-442
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Ensure PostgreSQL 18 binaries
        shell: bash
        run: |
          if [ ! -x /usr/lib/postgresql/18/bin/postgres ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ca-certificates curl lsb-release
            sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18
          fi
      - name: Install the previous schema and run the candidate package migration
        shell: bash
        run: |
          for schema in 420 442; do
            sudo unshare --mount --net --propagation private -- \
              /usr/bin/env "LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}" "$(command -v python)" -B \
              -m tests.migrations.native_package_upgrade ".net-local/native-upgrade-$schema" "$schema"
          done

  postgres:
    name: postgres (${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.postgres == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Keep bounded headroom for setup, integration, cleanup and cache upload.
    env:
      ADLOG_DISABLE_SCHEDULER: "1"
      ADLOG_DISABLE_COLLECTION: "1"
      ADLOG_CONTINUOUS_RECOVERY: "false"
      ADLOG_AI_EXECUTE_ENABLED: "false"
      ADLOG_DB_BACKEND: "postgres"
      # conftest clones the migrated or empty template into sli_test_* per test.
      ADLOG_TEST_PG_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_ci"
      ADLOG_TEST_PG_EMPTY_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_empty_ci"
      ADLOG_PG_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_ci"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      # Any duration-balanced Python shard can run the shipped .NET conveyor.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: server-dotnet/global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      - name: Build shipped server and packet report test
        run: |
          dotnet restore server-dotnet/tests/Sli.Server.Tests/Sli.Server.Tests.csproj --locked-mode
          dotnet build server-dotnet/tests/Sli.Server.Tests/Sli.Server.Tests.csproj --no-restore
      - name: Ensure PostgreSQL 18 binaries
        shell: bash
        run: |
          if [ ! -d /usr/lib/postgresql/18/bin ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
            sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            # Do not create a system cluster; this job owns only its temporary cluster.
            echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18
          fi
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Verify the beta kit migration path on private PostgreSQL 18
        if: matrix.shard == 1
        shell: bash
        run: |
          python -B - <<'PY'
          import tempfile
          from pathlib import Path

          from deploy.linux import build_beta_kit as kit

          pg_bin = Path("/usr/lib/postgresql/18/bin")
          with tempfile.TemporaryDirectory(prefix="sli-ci-payload-") as temporary:
              payload = Path(temporary) / "release"
              kit.copy_release(Path.cwd(), payload)
              kit.runtime_inventory(payload, pg_bin, "18", kit.postgres_environment(pg_bin))
          PY
      - name: Verify migrations and backup recovery on private PostgreSQL 18
        if: matrix.shard == 1
        env:
          SLI_UPGRADE_TEST_PG_BIN: /usr/lib/postgresql/18/bin
        run: |
          python -m pytest -q tests/unit/test_linux_install_upgrade_checks.py -k 's5_restore or apt_candidate'
          python -m pytest -q tests/unit/test_linux_native_pg_migrate.py
      - name: Start disposable PostgreSQL 18
        shell: bash
        run: |
          PGDATA=$(mktemp -d "$RUNNER_TEMP/sli-postgres.XXXXXX")
          echo "PGDATA=$PGDATA" >> "$GITHUB_ENV"
          initdb -D "$PGDATA" --username=postgres --auth=trust --encoding=UTF8
          printf "listen_addresses = '127.0.0.1'\nport = 5432\nunix_socket_directories = ''\n" >> "$PGDATA/postgresql.conf"
          pg_ctl -D "$PGDATA" -l "$PGDATA/server.log" -w start
      - name: Bootstrap baseline and migrations
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          import tempfile
          from pathlib import Path

          import psycopg
          from scripts.maintenance import existing_postgres_bootstrap as bootstrap

          root = Path.cwd()
          dsn = os.environ["ADLOG_TEST_PG_DSN"]
          runtime_password = secrets.token_urlsafe(32)
          migrations = bootstrap.forward_migration_inventory(root / "config/postgres_migrations")
          baseline = bootstrap.load_baseline(root / "config/postgres_baseline", migrations)
          with psycopg.connect(dsn, dbname="postgres", autocommit=True) as admin:
              if admin.execute("select current_setting('server_version_num')::int").fetchone()[0] // 10000 != 18:
                  raise bootstrap.BootstrapError("postgresql_18_required")
              bootstrap.create_target_database(
                  admin, database="sli_test_ci", runtime_password=runtime_password,
              )
              admin.execute("create database sli_test_empty_ci with template template0 encoding 'UTF8'")
          with psycopg.connect(dsn, autocommit=True) as admin:
              with tempfile.TemporaryDirectory(prefix="sli-ci-baseline-") as temporary:
                  bootstrap.apply_baseline_sequence(
                      baseline=baseline,
                      rendered_schema_path=bootstrap.render_baseline_schema(
                          baseline, "example.test", Path(temporary) / "baseline.sql",
                      ),
                      migrations=migrations, psql=Path("/usr/lib/postgresql/18/bin/psql"), host="127.0.0.1",
                      port=5432, database="sli_test_ci", admin_password="",
                      runtime_password=runtime_password,
                      platform_owner_password=secrets.token_urlsafe(32),
                      admin_execute=admin.execute,
                  )
              expected = sorted([
                  *bootstrap.base_schema_markers(root / "config/postgres_schema.sql"),
                  *((item.version, item.name) for item in migrations),
              ])
              actual = admin.execute(
                  "select version, name from public.schema_migrations order by version"
              ).fetchall()
              bootstrap.verify_exact_ledger(actual, expected)
          PY
      - name: Signed AD packet reaches the journal on current PostgreSQL
        if: matrix.shard == 1
        shell: bash
        run: |
          result=$(mktemp "$RUNNER_TEMP/sli-packet-report.XXXXXX")
          dotnet run --project server-dotnet/tests/Sli.Server.Tests/Sli.Server.Tests.csproj \
            --no-build -- -class Sli.Server.Tests.Agents.AgentPacketReportPostgresTests -failSkips -result-xml "$result"
          python - "$result" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          tests = ET.parse(sys.argv[1]).iter("test")
          if not any(test.get("type") == "Sli.Server.Tests.Agents.AgentPacketReportPostgresTests"
                     and test.get("result") == "Pass" for test in tests):
              raise SystemExit("The signed AD packet report scenario did not pass")
          PY
      - run: python -m scripts.ci.shipped_python_tests --output .ci-shipped-python-tests.txt
      - name: Verify full-schema ACL directory backup and parallel restore
        if: matrix.shard == 3
        run: python -m pytest -q tests/migrations/test_qw_restore_context_migration.py -m postgres_integration
      - name: Remaining PostgreSQL integration tests
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          # The ACL restore test runs in its own step.
          grep -vxF -e tests/migrations/test_qw_restore_context_migration.py \
            .ci-shipped-python-tests.txt > .ci-shipped-postgres-tests.txt
          python -m pytest -v -m "postgres_integration and not e2e and not legacy" \
            -p scripts.ci.postgres_test_shard --postgres-shard "$SHARD" "$SHARD_COUNT" \
            -o junit_family=xunit1 --junitxml=postgres-test-results.xml @.ci-shipped-postgres-tests.txt
      - name: Preserve per-case PostgreSQL test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-test-results-${{ matrix.shard }}
          path: postgres-test-results.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Stop disposable PostgreSQL 18
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${PGDATA:-}" ] && [ -f "$PGDATA/postmaster.pid" ]; then
            pg_ctl -D "$PGDATA" -m immediate -w stop
          fi

  t002-native:
    if: startsWith(github.head_ref || github.ref_name, 'codex/t002-')
    runs-on: ubuntu-latest
    # Keep bounded headroom for setup, integration, cleanup and cache upload.
    env:
      ADLOG_DISABLE_SCHEDULER: "1"
      ADLOG_DISABLE_COLLECTION: "1"
      ADLOG_CONTINUOUS_RECOVERY: "false"
      ADLOG_AI_EXECUTE_ENABLED: "false"
      ADLOG_DB_BACKEND: "postgres"
      # conftest clones the migrated or empty template into sli_test_* per test.
      ADLOG_TEST_PG_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_ci"
      ADLOG_TEST_PG_EMPTY_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_empty_ci"
      ADLOG_PG_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_ci"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: T002 existing local Docker capability preflight
        if: startsWith(github.head_ref || github.ref_name, 'codex/t002-')
        run: >-
          python3 scripts/ci/t002_clickhouse.py preflight
          --state "$RUNNER_TEMP/sli-t002-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Ensure PostgreSQL 18 binaries
        shell: bash
        run: |
          if [ ! -d /usr/lib/postgresql/18/bin ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
            sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            # Do not create a system cluster; this job owns only its temporary cluster.
            echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18
          fi
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Start disposable PostgreSQL 18
        shell: bash
        run: |
          PGDATA=$(mktemp -d "$RUNNER_TEMP/sli-postgres.XXXXXX")
          echo "PGDATA=$PGDATA" >> "$GITHUB_ENV"
          initdb -D "$PGDATA" --username=postgres --auth=trust --encoding=UTF8
          printf "listen_addresses = '127.0.0.1'\nport = 5432\nunix_socket_directories = ''\n" >> "$PGDATA/postgresql.conf"
          pg_ctl -D "$PGDATA" -l "$PGDATA/server.log" -w start
      - name: Bootstrap baseline and migrations
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          import tempfile
          from pathlib import Path

          import psycopg
          from scripts.maintenance import existing_postgres_bootstrap as bootstrap

          root = Path.cwd()
          dsn = os.environ["ADLOG_TEST_PG_DSN"]
          runtime_password = secrets.token_urlsafe(32)
          migrations = bootstrap.forward_migration_inventory(root / "config/postgres_migrations")
          baseline = bootstrap.load_baseline(root / "config/postgres_baseline", migrations)
          with psycopg.connect(dsn, dbname="postgres", autocommit=True) as admin:
              if admin.execute("select current_setting('server_version_num')::int").fetchone()[0] // 10000 != 18:
                  raise bootstrap.BootstrapError("postgresql_18_required")
              bootstrap.create_target_database(
                  admin, database="sli_test_ci", runtime_password=runtime_password,
              )
              admin.execute("create database sli_test_empty_ci with template template0 encoding 'UTF8'")
          with psycopg.connect(dsn, autocommit=True) as admin:
              with tempfile.TemporaryDirectory(prefix="sli-ci-baseline-") as temporary:
                  bootstrap.apply_baseline_sequence(
                      baseline=baseline,
                      rendered_schema_path=bootstrap.render_baseline_schema(
                          baseline, "example.test", Path(temporary) / "baseline.sql",
                      ),
                      migrations=migrations, psql=Path("/usr/lib/postgresql/18/bin/psql"), host="127.0.0.1",
                      port=5432, database="sli_test_ci", admin_password="",
                      runtime_password=runtime_password,
                      platform_owner_password=secrets.token_urlsafe(32),
                      admin_execute=admin.execute,
                  )
              expected = sorted([
                  *bootstrap.base_schema_markers(root / "config/postgres_schema.sql"),
                  *((item.version, item.name) for item in migrations),
              ])
              actual = admin.execute(
                  "select version, name from public.schema_migrations order by version"
              ).fetchall()
              bootstrap.verify_exact_ledger(actual, expected)
          PY
      - name: T002 native synthetic report with disposable ClickHouse
        if: startsWith(github.head_ref || github.ref_name, 'codex/t002-')
        run: >-
          python scripts/ci/t002_clickhouse.py run
          --state "$RUNNER_TEMP/sli-t002-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - name: Remove T002 disposable ClickHouse
        if: ${{ always() }}
        run: >-
          python3 scripts/ci/t002_clickhouse.py cleanup
          --state "$RUNNER_TEMP/sli-t002-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - name: Stop disposable PostgreSQL 18
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${PGDATA:-}" ] && [ -f "$PGDATA/postmaster.pid" ]; then
            pg_ctl -D "$PGDATA" -m immediate -w stop
          fi


