name: Pull Request gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # PRs that touch only the React UI or docs skip the Python suites:
    # tests then runs only Python tests that read frontend/, postgres is skipped.
    runs-on: ${{ vars.SLI_LINUX_RUNNER || 'ubuntu-latest' }}
    outputs:
      python: ${{ steps.diff.outputs.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      - id: diff
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python=true
          if [ "$EVENT" = pull_request ]; then
            # --no-renames: a move out of server/ must count its old path too.
            files=$(git diff --name-only --no-renames "$BASE...$HEAD")
            other=$(printf '%s\n' "$files" | grep -vE '^(frontend/|docs/)|\.md$' || true)
            if [ -n "$files" ] && [ -z "$other" ]; then python=false; fi
          fi
          echo "python=$python" | tee -a "$GITHUB_OUTPUT"

  source:
    # Keep the existing required check red if the disposable DB gate fails.
    needs: [changes, postgres]
    if: ${{ always() }}
    runs-on: ${{ vars.SLI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Require PostgreSQL integration success
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
          POSTGRES_RESULT: ${{ needs.postgres.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$POSTGRES_RESULT" = success || { test "$PYTHON_CHANGED" = false && test "$POSTGRES_RESULT" = skipped; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Fetch setup actions over git: codeload archives time out during job setup.
      # Keep the same action revision and use the ignored artifacts directory.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: actions/setup-python
          ref: a26af69be951a213d495a4c3e4e4022e16d87065
          path: artifacts/ci-actions/setup-python
          persist-credentials: false
      - uses: ./artifacts/ci-actions/setup-python
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m pip install --disable-pip-version-check ruff==0.16.9
      - run: python -m ruff check --config .github/ruff-ci.toml server scripts tests
      - run: python scripts/maintenance/github_sanitary_check.py --root . --json
      - name: UI and API domain binding guard
        run: python -m pytest -q tests/tooling/test_ui_domain_binding_guard.py tests/unit/test_ui_domain_binding_api.py tests/core/test_report_domain.py
      - run: python -m compileall -q server scripts tests
      - name: Secret manifest and provisioning contracts (no database)
        run: |
          python -m ruff check --config .github/ruff-ci.toml deploy/linux/sli_secrets.py deploy/linux/installation.py deploy/linux/sli_update.py deploy/linux/updater_component.py deploy/linux/updater_launcher.py tests/unit/test_sli_secrets.py
          python -m pytest -q tests/unit/test_sli_secrets.py
      - name: Authenticated updater transition and isolated closure (Linux, synthetic only)
        run: python -m pytest -q tests/unit/test_updater_component.py tests/unit/test_updater_transition_contract.py tests/unit/test_updater_transition.py tests/unit/test_updater_isolated_closure.py tests/unit/test_plugin_validation.py
      - run: python -m pytest -q tests/events/test_event_catalog_contract.py tests/sources/test_plugin_package_manifest.py tests/migrations/test_sli_v4_contract.py
      - name: Verify native Linux unit contracts
        env:
          ADLOG_DISABLE_SCHEDULER: "1"
          ADLOG_DISABLE_COLLECTION: "1"
          ADLOG_CONTINUOUS_RECOVERY: "false"
          ADLOG_AI_EXECUTE_ENABLED: "false"
          ADLOG_DB_BACKEND: postgres
          ADLOG_PG_DSN: "postgresql://sli-pytest.invalid:5432/sli_pytest_unreachable"
        run: >-
          python -m pytest -q -m "posix_only and not postgres_integration and not host_dependent"
          tests/storage/test_raw_zip_durability.py
          tests/storage/test_stabilization_runtime_security_ai.py::test_runtime_storage_cleanup_can_zip_archive_and_explain_exclusions
          tests/unit/test_ad_credential_delivery.py tests/unit/test_ad_credential_secrets.py
          tests/unit/test_ad_gpo_core_jobs.py tests/unit/test_ad_gpo_pilot_acceptance.py
          tests/unit/test_ad_plugin_registration.py tests/unit/test_agent_group_bootstrap.py
          tests/unit/test_core_job_queue.py
          tests/unit/test_linux_backup_capacity.py tests/unit/test_linux_backup_health_assurance.py
          tests/unit/test_linux_backup_pg_diagnostics.py tests/unit/test_linux_native_apt.py
          tests/unit/test_linux_restore_sandbox.py

  tests:
    # Shipped Python unit/contracts: live-PostgreSQL tests are
    # marked postgres_integration and run in the disposable postgres job;
    # host_dependent tests need operator-host software (RSAT) or idle capacity.
    # Native POSIX contracts run on Linux in the required source job.
    needs: changes
    if: ${{ always() }}
    runs-on: ${{ vars.SLI_LINUX_RUNNER || 'ubuntu-latest' }}
    env:
      ADLOG_DISABLE_SCHEDULER: "1"
      ADLOG_DISABLE_COLLECTION: "1"
      ADLOG_CONTINUOUS_RECOVERY: "false"
      ADLOG_AI_EXECUTE_ENABLED: "false"
      ADLOG_DB_BACKEND: "postgres"
      ADLOG_PG_DSN: "postgresql://sli-pytest.invalid:5432/sli_pytest_unreachable"
      # Windows consoles may use cp1252; CLIs print Russian text.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Source-evidence tests read historical commits.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      # Some tooling tests call node (acceptance resume fingerprints).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python scripts/ci/shipped_python_tests.py --output .ci-shipped-python-tests.txt
      - name: Unit and contract tests
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$PYTHON_CHANGED" = false ]; then
            # UI-only change: run the Python tests that read frontend/ files.
            mapfile -t selected < <(grep -rl --include='test_*.py' -e frontend tests | sort)
            echo "UI-only change: ${#selected[@]} Python test files read frontend/"
          else
            # Tests of shipped code only (server/ removal, stage B).
            selected=("@.ci-shipped-python-tests.txt")
          fi
          python -m pytest -q -m "not postgres_integration and not host_dependent and not posix_only" "${selected[@]}"

  frontend:
    runs-on: ${{ vars.SLI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Registry metadata tests import Python report modules.
      # Remote pip/npm cache restores can exhaust this job's timeout.
      # Install dependencies directly and keep all validation steps below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: actions/setup-python
          ref: a26af69be951a213d495a4c3e4e4022e16d87065
          path: artifacts/ci-actions/setup-python
          persist-credentials: false
      - uses: ./artifacts/ci-actions/setup-python
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: actions/setup-node
          ref: 49933ea5288caeca8642d1e84afbd3f7d6820020
          path: artifacts/ci-actions/setup-node
          persist-credentials: false
      - uses: ./artifacts/ci-actions/setup-node
        with:
          node-version: "22"
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend exec vitest run src
      - run: npm --prefix frontend run build

  postgres:
    name: postgres (${{ matrix.shard }})
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    runs-on: ${{ vars.SLI_LINUX_RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Keep bounded headroom for setup, integration, cleanup and cache upload.
    env:
      ADLOG_DISABLE_SCHEDULER: "1"
      ADLOG_DISABLE_COLLECTION: "1"
      ADLOG_CONTINUOUS_RECOVERY: "false"
      ADLOG_AI_EXECUTE_ENABLED: "false"
      ADLOG_DB_BACKEND: "postgres"
      # conftest clones the migrated or empty template into sli_test_* per test.
      ADLOG_TEST_PG_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_ci"
      ADLOG_TEST_PG_EMPTY_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_empty_ci"
      ADLOG_PG_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_ci"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      # Any duration-balanced Python shard can run the shipped .NET conveyor.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: server-dotnet/global.json
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      - name: Build shipped server and packet report test
        run: |
          dotnet restore server-dotnet/tests/Sli.Server.Tests/Sli.Server.Tests.csproj --locked-mode
          dotnet build server-dotnet/tests/Sli.Server.Tests/Sli.Server.Tests.csproj --no-restore
      - name: Ensure PostgreSQL 18 binaries
        shell: bash
        run: |
          if [ ! -d /usr/lib/postgresql/18/bin ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
            sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            # Do not create a system cluster; this job owns only its temporary cluster.
            echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18
          fi
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Verify migrations and backup recovery on private PostgreSQL 18
        if: matrix.shard == 1
        env:
          SLI_UPGRADE_TEST_PG_BIN: /usr/lib/postgresql/18/bin
        run: |
          python -m pytest -q tests/unit/test_linux_install_upgrade_checks.py -k 's5_restore or apt_candidate'
          python -m pytest -q tests/unit/test_linux_native_pg_migrate.py
      - name: Start disposable PostgreSQL 18
        shell: bash
        run: |
          PGDATA=$(mktemp -d "$RUNNER_TEMP/sli-postgres.XXXXXX")
          echo "PGDATA=$PGDATA" >> "$GITHUB_ENV"
          initdb -D "$PGDATA" --username=postgres --auth=trust --encoding=UTF8
          printf "listen_addresses = '127.0.0.1'\nport = 5432\nunix_socket_directories = ''\n" >> "$PGDATA/postgresql.conf"
          pg_ctl -D "$PGDATA" -l "$PGDATA/server.log" -w start
      - name: Bootstrap baseline and migrations
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          import tempfile
          from pathlib import Path

          import psycopg
          from scripts.maintenance import existing_postgres_bootstrap as bootstrap

          root = Path.cwd()
          dsn = os.environ["ADLOG_TEST_PG_DSN"]
          runtime_password = secrets.token_urlsafe(32)
          migrations = bootstrap.forward_migration_inventory(root / "config/postgres_migrations")
          baseline = bootstrap.load_baseline(root / "config/postgres_baseline", migrations)
          with psycopg.connect(dsn, dbname="postgres", autocommit=True) as admin:
              if admin.execute("select current_setting('server_version_num')::int").fetchone()[0] // 10000 != 18:
                  raise bootstrap.BootstrapError("postgresql_18_required")
              bootstrap.create_target_database(
                  admin, database="sli_test_ci", runtime_password=runtime_password,
              )
              admin.execute("create database sli_test_empty_ci with template template0 encoding 'UTF8'")
          with psycopg.connect(dsn, autocommit=True) as admin:
              with tempfile.TemporaryDirectory(prefix="sli-ci-baseline-") as temporary:
                  bootstrap.apply_baseline_sequence(
                      baseline=baseline,
                      rendered_schema_path=bootstrap.render_baseline_schema(
                          baseline, "example.test", Path(temporary) / "baseline.sql",
                      ),
                      migrations=migrations, psql=Path("/usr/lib/postgresql/18/bin/psql"), host="127.0.0.1",
                      port=5432, database="sli_test_ci", admin_password="",
                      runtime_password=runtime_password,
                      platform_owner_password=secrets.token_urlsafe(32),
                      admin_execute=admin.execute,
                  )
              expected = sorted([
                  *bootstrap.base_schema_markers(root / "config/postgres_schema.sql"),
                  *((item.version, item.name) for item in migrations),
              ])
              actual = admin.execute(
                  "select version, name from public.schema_migrations order by version"
              ).fetchall()
              bootstrap.verify_exact_ledger(actual, expected)
          PY
      - name: Signed AD packet reaches the journal on current PostgreSQL
        if: matrix.shard == 1
        shell: bash
        run: |
          result=$(mktemp "$RUNNER_TEMP/sli-packet-report.XXXXXX")
          dotnet run --project server-dotnet/tests/Sli.Server.Tests/Sli.Server.Tests.csproj \
            --no-build -- -class Sli.Server.Tests.Agents.AgentPacketReportPostgresTests -failSkips -result-xml "$result"
          python - "$result" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          tests = ET.parse(sys.argv[1]).iter("test")
          if not any(test.get("type") == "Sli.Server.Tests.Agents.AgentPacketReportPostgresTests"
                     and test.get("result") == "Pass" for test in tests):
              raise SystemExit("The signed AD packet report scenario did not pass")
          PY
      - run: python scripts/ci/shipped_python_tests.py --output .ci-shipped-python-tests.txt
      - name: T002 actual PostgreSQL context at synthetic enterprise scale
        if: matrix.shard == 1
        run: python -m pytest -q -s tests/reporting/test_new_logon_pairs_context_native.py
      - name: T051 bounded synthetic context plans and typed timeout
        if: matrix.shard == 2
        run: python -m pytest -q -s tests/reporting/test_new_logon_pairs_diagnostics_postgres.py
      - name: Measure synthetic collection aggregation equivalence
        if: matrix.shard == 2
        run: python -m pytest -q -s tests/reporting/test_agent_collection_query_plan_postgres.py
      - name: Check plugin receipt fact parity
        if: matrix.shard == 3
        run: python -m pytest -q tests/reporting/test_plugin_receipts_query_plan_postgres.py::test_split_candidate_preserves_exact_receipt_import_snapshot_facts
      - name: Verify full-schema ACL directory backup and parallel restore
        if: matrix.shard == 3
        run: python -m pytest -q tests/migrations/test_qw_restore_context_migration.py -m postgres_integration
      - name: Remaining PostgreSQL integration tests
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          # --ignore does not drop a file passed explicitly, so the three files run
          # in their own steps above are removed from the shipped list here.
          grep -vxF -e tests/migrations/test_qw_restore_context_migration.py -e tests/reporting/test_agent_collection_query_plan_postgres.py -e tests/reporting/test_plugin_receipts_query_plan_postgres.py .ci-shipped-python-tests.txt > .ci-shipped-postgres-tests.txt
          python -m pytest -v -m "postgres_integration and not e2e" \
            -p scripts.ci.postgres_test_shard --postgres-shard "$SHARD" "$SHARD_COUNT" \
            -o junit_family=xunit1 --junitxml=postgres-test-results.xml @.ci-shipped-postgres-tests.txt
      - name: Preserve per-case PostgreSQL test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: postgres-test-results-${{ matrix.shard }}
          path: postgres-test-results.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Stop disposable PostgreSQL 18
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${PGDATA:-}" ] && [ -f "$PGDATA/postmaster.pid" ]; then
            pg_ctl -D "$PGDATA" -m immediate -w stop
          fi

  t002-native:
    if: startsWith(github.head_ref || github.ref_name, 'codex/t002-')
    runs-on: ${{ vars.SLI_T002_RUNNER || 'ubuntu-latest' }}
    # Keep bounded headroom for setup, integration, cleanup and cache upload.
    env:
      ADLOG_DISABLE_SCHEDULER: "1"
      ADLOG_DISABLE_COLLECTION: "1"
      ADLOG_CONTINUOUS_RECOVERY: "false"
      ADLOG_AI_EXECUTE_ENABLED: "false"
      ADLOG_DB_BACKEND: "postgres"
      # conftest clones the migrated or empty template into sli_test_* per test.
      ADLOG_TEST_PG_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_ci"
      ADLOG_TEST_PG_EMPTY_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_empty_ci"
      ADLOG_PG_DSN: "postgresql://postgres@127.0.0.1:5432/sli_test_ci"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: T002 existing local Docker capability preflight
        if: startsWith(github.head_ref || github.ref_name, 'codex/t002-')
        run: >-
          python3 scripts/ci/t002_clickhouse.py preflight
          --state "$RUNNER_TEMP/sli-t002-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Ensure PostgreSQL 18 binaries
        shell: bash
        run: |
          if [ ! -d /usr/lib/postgresql/18/bin ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ca-certificates curl gnupg lsb-release
            sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
            # Do not create a system cluster; this job owns only its temporary cluster.
            echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf > /dev/null
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-client-18
          fi
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Start disposable PostgreSQL 18
        shell: bash
        run: |
          PGDATA=$(mktemp -d "$RUNNER_TEMP/sli-postgres.XXXXXX")
          echo "PGDATA=$PGDATA" >> "$GITHUB_ENV"
          initdb -D "$PGDATA" --username=postgres --auth=trust --encoding=UTF8
          printf "listen_addresses = '127.0.0.1'\nport = 5432\nunix_socket_directories = ''\n" >> "$PGDATA/postgresql.conf"
          pg_ctl -D "$PGDATA" -l "$PGDATA/server.log" -w start
      - name: Bootstrap baseline and migrations
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          import tempfile
          from pathlib import Path

          import psycopg
          from scripts.maintenance import existing_postgres_bootstrap as bootstrap

          root = Path.cwd()
          dsn = os.environ["ADLOG_TEST_PG_DSN"]
          runtime_password = secrets.token_urlsafe(32)
          migrations = bootstrap.forward_migration_inventory(root / "config/postgres_migrations")
          baseline = bootstrap.load_baseline(root / "config/postgres_baseline", migrations)
          with psycopg.connect(dsn, dbname="postgres", autocommit=True) as admin:
              if admin.execute("select current_setting('server_version_num')::int").fetchone()[0] // 10000 != 18:
                  raise bootstrap.BootstrapError("postgresql_18_required")
              bootstrap.create_target_database(
                  admin, database="sli_test_ci", runtime_password=runtime_password,
              )
              admin.execute("create database sli_test_empty_ci with template template0 encoding 'UTF8'")
          with psycopg.connect(dsn, autocommit=True) as admin:
              with tempfile.TemporaryDirectory(prefix="sli-ci-baseline-") as temporary:
                  bootstrap.apply_baseline_sequence(
                      baseline=baseline,
                      rendered_schema_path=bootstrap.render_baseline_schema(
                          baseline, "example.test", Path(temporary) / "baseline.sql",
                      ),
                      migrations=migrations, psql=Path("/usr/lib/postgresql/18/bin/psql"), host="127.0.0.1",
                      port=5432, database="sli_test_ci", admin_password="",
                      runtime_password=runtime_password,
                      platform_owner_password=secrets.token_urlsafe(32),
                      admin_execute=admin.execute,
                  )
              expected = sorted([
                  *bootstrap.base_schema_markers(root / "config/postgres_schema.sql"),
                  *((item.version, item.name) for item in migrations),
              ])
              actual = admin.execute(
                  "select version, name from public.schema_migrations order by version"
              ).fetchall()
              bootstrap.verify_exact_ledger(actual, expected)
          PY
      - name: T002 native synthetic report with disposable ClickHouse
        if: startsWith(github.head_ref || github.ref_name, 'codex/t002-')
        run: >-
          python scripts/ci/t002_clickhouse.py run
          --state "$RUNNER_TEMP/sli-t002-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - name: Remove T002 disposable ClickHouse
        if: ${{ always() }}
        run: >-
          python3 scripts/ci/t002_clickhouse.py cleanup
          --state "$RUNNER_TEMP/sli-t002-${{ github.run_id }}-${{ github.run_attempt }}.json"
      - name: Stop disposable PostgreSQL 18
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "${PGDATA:-}" ] && [ -f "$PGDATA/postmaster.pid" ]; then
