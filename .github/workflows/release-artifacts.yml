name: Unsigned release artifacts

on:
  push:
    tags: ['sli-*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release major.minor.patch (must match VERSION when present)'
        required: true
        type: string
      from_version:
        description: 'Exact update base; defaults to the previous reachable sli-* tag'
        required: false
        type: string

      internal_test_build:
        description: 'Internal test only: не для выпуска'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-artifacts-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.6'
      - name: Install locked inventory environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sli-release-venv"
          "$RUNNER_TEMP/sli-release-venv/bin/python" -m pip install --disable-pip-version-check --no-deps -r requirements.lock.txt
          "$RUNNER_TEMP/sli-release-venv/bin/python" -m pip check
      - name: Prepare exact-SHA unsigned kit
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_FROM_VERSION: ${{ inputs.from_version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          INTERNAL_TEST_BUILD: ${{ inputs.internal_test_build }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          if [ "$RELEASE_REF_TYPE" = tag ]; then version="${RELEASE_REF_NAME#sli-}"; fi
          args=()
          if [ "$INTERNAL_TEST_BUILD" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$RELEASE_REF_TYPE" != tag
            args+=(--internal-test-build)
          fi
          if [ -n "$RELEASE_FROM_VERSION" ]; then args+=(--from-version "$RELEASE_FROM_VERSION"); fi
          kit="$RUNNER_TEMP/sli-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          "$RUNNER_TEMP/sli-release-venv/bin/python" tools/release_artifacts.py prepare \
            --sha "$RELEASE_SHA" --version "$version" --repository "$RELEASE_REPOSITORY" \
            --output "$kit" "${args[@]}"
          # Host Python verification libraries are bundled on CI; no pip is run on target.
          "$RUNNER_TEMP/sli-release-venv/bin/python" tools/release_artifacts.py bundle-host-libs \
            --kit "$kit" "${args[@]}"
          echo "SLI_RELEASE_KIT=$kit" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sli-${{ inputs.internal_test_build && 'internal-test-not-for-release' || 'unsigned' }}-${{ github.sha }}
          path: ${{ env.SLI_RELEASE_KIT }}/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
