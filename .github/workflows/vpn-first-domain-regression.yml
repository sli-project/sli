name: Isolated VPN first-domain regression
on:
  push:
    branches: [codex/beta-vpn-first-domain]
    paths: [.github/workflows/vpn-first-domain-regression.yml, frontend/src/app/report-v2/vpn-first-domain.dom.test.tsx, frontend/src/app/report-v2/ReportRenderer.tsx]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test -- src/app/report-v2/vpn-first-domain.dom.test.tsx
