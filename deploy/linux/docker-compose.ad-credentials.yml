services:
  api:
    user: "0:0"
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    entrypoint: [python, -m, deploy.linux.ad_credentials_entrypoint]
    tmpfs:
      - /run/ad-credentials:mode=0700
    environment:
      SLI_AD_CREDENTIALS_MASTER_KEY_FILE: /run/ad-credentials/ad_credentials_master_key
    secrets:
      - source: ad_credentials_master_key
        target: /run/ad-credentials-source/ad_credentials_master_key
secrets:
  ad_credentials_master_key:
    file: ${SLI_SECRETS_DIR:?Set protected host secret directory}/ad_credentials_master_key
