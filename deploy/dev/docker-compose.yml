name: sli-dev

x-dev: &dev
  image: sli-dev:local
  build:
    context: .
    dockerfile: Dockerfile
  user: dev
  working_dir: /workspace/sli-platform
  init: true
  command: [sleep, infinity]
  environment:
    ADLOG_DB_BACKEND: postgres
    # Unit tests must never discover a production database by default.
    ADLOG_PG_DSN: postgresql://sli-pytest.invalid:5432/sli_pytest_unreachable
    ADLOG_TEST_PG_DSN: postgresql://postgres@pg-test:5432/sli_test_dev
    ADLOG_TEST_PG_EMPTY_DSN: postgresql://postgres@pg-test:5432/sli_test_empty_dev
  volumes:
    - type: bind
      source: ${SLI_DEV_SOURCE:?Set absolute path of the development clone}
      target: /workspace/sli-platform
      bind:
        create_host_path: false
    - sli-dev-venv:/opt/venv
    - sli-dev-node-modules:/workspace/sli-platform/node_modules
    - sli-dev-frontend-node-modules:/workspace/sli-platform/frontend/node_modules
    - sli-dev-npm-cache:/home/dev/.npm
  depends_on:
    pg-test:
      condition: service_healthy

services:
  dev:
    <<: *dev

  # Start this service instead of dev only after the owner enables the profile.
  dev-docker:
    <<: *dev
    profiles: [docker-socket]
    group_add:
      - "${SLI_DEV_DOCKER_GID:-65534}"
    volumes:
      - type: bind
        source: ${SLI_DEV_SOURCE:?Set absolute path of the development clone}
        target: /workspace/sli-platform
        bind:
          create_host_path: false
      - sli-dev-venv:/opt/venv
      - sli-dev-node-modules:/workspace/sli-platform/node_modules
      - sli-dev-frontend-node-modules:/workspace/sli-platform/frontend/node_modules
      - sli-dev-npm-cache:/home/dev/.npm
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false

  pg-test:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      # Disposable, isolated test data only; no passwords or production secrets.
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql
    networks: [default]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  sli-dev-venv:
    name: sli-dev-venv
  sli-dev-node-modules:
    name: sli-dev-node-modules
  sli-dev-frontend-node-modules:
    name: sli-dev-frontend-node-modules
  sli-dev-npm-cache:
    name: sli-dev-npm-cache
